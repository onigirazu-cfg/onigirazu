run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  dupl:
    threshold: 100
  funlen:
    lines: 100
    statements: 50
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/onigirazu-cfg/onigirazu)
  goconst:
    min-len: 2
    min-occurrences: 2
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: github.com/onigirazu-cfg/onigirazu
  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
  govet:
    enable:
      - shadow
  lll:
    line-length: 140
  misspell:
    locale: US
  nolintlint:
    allow-unused: false
    require-explanation: false
    require-specific: false

linters:
  enable:
    # Format and style linters (work without compilation)
    - gofmt
    - goimports
    - gci
    - lll
    - misspell
    - whitespace
    - nolintlint

    # Basic linters that can work with syntax errors
    - dupl
    - funlen
    - gocyclo
    - goconst
    - mnd
    - nakedret

  disable:
    # Disable linters that require successful compilation
    - typecheck
    - unused
    - ineffassign
    - staticcheck
    - gosimple
    - govet
    - errcheck
    - bodyclose
    - depguard
    - dogsled
    - copyloopvar
    - gochecknoinits
    - gocritic
    - goprintffuncname
    - gosec
    - rowserrcheck
    - stylecheck
    - unconvert
    - unparam
    - noctx

issues:
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  exclude-dirs:
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - mnd
        - funlen
        - goconst
    - path: cmd/
      linters:
        - mnd
    - linters:
        - lll
      source: "^//go:generate "

  exclude-use-default: false
  exclude:
    - 'declaration of "(err|ctx)" shadows declaration at'
    - 'shadow: declaration of "err" shadows declaration'
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
