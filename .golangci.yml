run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  dupl:
    threshold: 100
  funlen:
    lines: 150
    statements: 150
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/onigirazu-cfg/onigirazu)
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
  gocyclo:
    min-complexity: 60
  goimports:
    local-prefixes: github.com/onigirazu-cfg/onigirazu
  mnd:
    checks:
      - argument
      - case
    ignored-numbers:
      - '0'
      - '1'
      - '2'
      - '3'
      - '10'
      - '30'
      - '100'
      - '1024'
      - '0600'
      - '0644'
      - '0755'
  govet:
    enable:
      - shadow
  lll:
    line-length: 250
  misspell:
    locale: US

linters:
  enable:
    # Format and style linters (work without compilation)
    - gofmt
    - goimports
    - gci
    - lll
    - misspell
    - whitespace
    - nolintlint

    # Basic linters that can work with syntax errors
    - dupl
    - funlen
    - gocyclo
    - mnd
    - nakedret

  disable:
    # Disable linters that require successful compilation
    - typecheck
    - unused
    - ineffassign
    - staticcheck
    - gosimple
    - govet
    - errcheck
    - bodyclose
    - depguard
    - dogsled
    - copyloopvar
    - gochecknoinits
    - gocritic
    - goprintffuncname
    - gosec
    - rowserrcheck
    - stylecheck
    - unconvert
    - unparam
    - noctx
    # Disable goconst - too strict for string literals
    - goconst

issues:
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  exclude-dirs:
    - vendor
    - tests
  exclude-rules:
    - path: _test\.go
      linters:
        - mnd
        - funlen
        - goconst
    - path: cmd/
      linters:
        - mnd
        - funlen
        - gocyclo
    - path: tests/
      linters:
        - unused
        - deadcode
    - linters:
        - lll
      source: "^//go:generate "
    - text: "strings.Title has been deprecated"
      linters:
        - staticcheck
    - text: "io/ioutil.*has been deprecated"
      linters:
        - staticcheck
    - text: "SA1019"
      linters:
        - staticcheck
    - text: "is unused"
      linters:
        - unused
    - text: "U1000"
      linters:
        - unused
    - path: "(tests/|cmd/)"
      linters:
        - unused
        - goconst

  exclude-use-default: false
  exclude:
    - 'declaration of "(err|ctx)" shadows declaration at'
    - 'shadow: declaration of "err" shadows declaration'
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
