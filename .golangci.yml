version: "2"

run:
  timeout: 10m
  tests: true

linters:
  enable:
    # Existing linters
    - misspell
    - nakedret
    - nolintlint
    - whitespace

    # Critical security & quality linters (FIXED in Phase 1)
    - errcheck
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - unconvert

    # Additional quality linters (Quick Win improvements)
    - bodyclose      # Ensure HTTP response bodies are closed
    - gocyclo        # Cyclomatic complexity detection
    - unused         # Detect unused code
    - gocritic       # Comprehensive Go code checks
    - dupl           # Code duplication detection

  disable:
    - copyloopvar
    - depguard
    - dogsled
    - gochecknoinits
    - goconst
    - goprintffuncname
    - noctx
    - rowserrcheck
    - unparam

  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 150
      statements: 120
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - performance
        - style
    gocyclo:
      min-complexity: 20  # Reduced from 30 for better code quality
    govet:
      enable:
        - shadow
    lll:
      line-length: 250

    # Config for newly enabled linters (Phase 1 fixes)
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - log.Print
        - log.Println
        - log.Printf

    gosec:
      excludes:
        - G107  # Potential HTTP request made with variable url
        - G304  # File path provided as taint input (used for config files)
    misspell:
      locale: US
    mnd:
      checks:
        - argument
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "8"
        - "10"
        - "22"
        - "30"
        - "50"
        - "60"
        - "100"
        - "100.0"
        - "500"
        - "1000"
        - "1024"
        - "9090"
        - "0600"
        - "0644"
        - "0700"
        - "0755"

  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - funlen
          - goconst
          - mnd
      - path: cmd/
        linters:
          - funlen
          - gocyclo
          - mnd
      - path: tests/
        linters:
          - unused
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - staticcheck
        text: strings.Title has been deprecated
      - linters:
          - staticcheck
        text: io/ioutil.*has been deprecated
      - linters:
          - staticcheck
        text: SA1019
      - linters:
          - unused
        text: is unused
      - linters:
          - unused
        text: U1000
      - path: (tests/|cmd/)
        linters:
          - goconst
          - unused
      - path: (.+)\.go$
        text: declaration of "(err|ctx)" shadows declaration at
      - path: (.+)\.go$
        text: 'shadow: declaration of "err" shadows declaration'
    paths:
      - third_party
      - builtin
      - examples

issues:
  max-issues-per-linter: 100
  max-same-issues: 20
