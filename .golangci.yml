version: "2"

run:
  timeout: 10m
  tests: true

linters:
  enable:
    # Existing linters
    - misspell
    - nakedret
    - nolintlint
    - whitespace

    # Critical security & quality linters (FIXED in Phase 1)
    - errcheck
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - unconvert

    # Additional quality linters (Quick Win improvements)
    - bodyclose      # Ensure HTTP response bodies are closed
    - unused         # Detect unused code
    - gocritic       # Comprehensive Go code checks

  disable:
    - copyloopvar
    - depguard
    - dogsled
    - gochecknoinits
    - goconst
    - goprintffuncname
    - noctx
    - rowserrcheck
    - unparam

  settings:
    dupl:
      threshold: 150  # Increased from 100 to reduce false positives for similar patterns
    funlen:
      lines: 150
      statements: 120
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
        - hugeParam
        - importShadow
        - paramTypeCombine
        - rangeValCopy
        - unnamedResult
        - assignOp
        - builtinShadowDecl
        - elseif
        - filepathJoin
        - singleCaseSwitch
        - sloppyReassign
        - sprintfQuotedString
      enabled-tags:
        - diagnostic
    gocyclo:
      min-complexity: 30
    govet:
      enable:
        - shadow
    lll:
      line-length: 250

    # Config for newly enabled linters (Phase 1 fixes)
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - log.Print
        - log.Println
        - log.Printf

    gosec:
      excludes:
        - G107  # Potential HTTP request made with variable url
        - G301  # Directory permissions: managed hosts need world-readable dirs
        - G306  # File permissions: managed hosts need world-readable files
        - G204  # Subprocess with variable args: running commands is the tool's job
        - G304  # File path provided as taint input (used for config files)
        - G703  # Path traversal via taint: paths come from the operator's playbooks
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -QF*
    misspell:
      locale: US
    mnd:
      checks:
        - argument
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "8"
        - "10"
        - "22"
        - "30"
        - "50"
        - "60"
        - "100"
        - "100.0"
        - "500"
        - "1000"
        - "1024"
        - "9090"
        - "0600"
        - "0644"
        - "0700"
        - "0755"

  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - funlen
          - goconst
          - mnd
          - dupl  # Test code duplication is acceptable
          - errcheck
          - gocritic
          - gocyclo
          - gosec
      - path: cmd/
        linters:
          - funlen
          - gocyclo
          - mnd
      - path: tests/
        linters:
          - unused
      - path: (tests/|cmd/)
        linters:
          - goconst
          - unused
      - path: (.+)\.go$
        text: declaration of "(err|ctx)" shadows declaration at
    paths:
      - third_party
      - builtin
      - examples

issues:
  max-issues-per-linter: 100
  max-same-issues: 20
