version: "2"
run:
  tests: true
linters:
  enable:
    - misspell
    - nakedret
    - nolintlint
    - whitespace
  disable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - errcheck
    - gochecknoinits
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - noctx
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 250
      statements: 250
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - performance
        - style
    gocyclo:
      min-complexity: 60
    govet:
      enable:
        - shadow
    lll:
      line-length: 250
    misspell:
      locale: US
    mnd:
      checks:
        - argument
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "8"
        - "10"
        - "22"
        - "30"
        - "50"
        - "60"
        - "100"
        - "100.0"
        - "500"
        - "1000"
        - "1024"
        - "9090"
        - "0600"
        - "0644"
        - "0700"
        - "0755"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - goconst
          - mnd
        path: _test\.go
      - linters:
          - funlen
          - gocyclo
          - mnd
        path: cmd/
      - linters:
          - deadcode
          - unused
        path: tests/
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - staticcheck
        text: strings.Title has been deprecated
      - linters:
          - staticcheck
        text: io/ioutil.*has been deprecated
      - linters:
          - staticcheck
        text: SA1019
      - linters:
          - unused
        text: is unused
      - linters:
          - unused
        text: U1000
      - linters:
          - goconst
          - unused
        path: (tests/|cmd/)
      - path: (.+)\.go$
        text: declaration of "(err|ctx)" shadows declaration at
      - path: (.+)\.go$
        text: 'shadow: declaration of "err" shadows declaration'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/onigirazu-cfg/onigirazu)
    goimports:
      local-prefixes:
        - github.com/onigirazu-cfg/onigirazu
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
