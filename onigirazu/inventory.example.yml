# Onigirazu Inventory Example
# This file defines hosts and groups for your infrastructure

# Individual hosts
hosts:
  # Local machine
  localhost:
    address: 127.0.0.1
    connection: local

  # Remote server example
  web-server-01:
    address: 192.168.1.10
    port: 22
    user: deploy
    vars:
      http_port: 80
      https_port: 443
      domain: example.com

  # Another remote server
  db-server-01:
    address: 192.168.1.20
    port: 22
    user: deploy
    vars:
      db_port: 5432
      db_name: production

# Groups of hosts
groups:
  # Web servers group
  webservers:
    hosts:
      - web-server-01
    vars:
      nginx_version: latest
      enable_ssl: true

  # Database servers group
  databases:
    hosts:
      - db-server-01
    vars:
      postgresql_version: "15"
      max_connections: 100

  # Development environment
  development:
    hosts:
      - localhost
    vars:
      environment: dev
      debug: true

  # Production environment
  production:
    hosts:
      - web-server-01
      - db-server-01
    vars:
      environment: prod
      debug: false
      backup_enabled: true

  # All servers (meta-group)
  all:
    children:
      - webservers
      - databases
    vars:
      # Global variables for all hosts
      timezone: UTC
      ntp_servers:
        - 0.pool.ntp.org
        - 1.pool.ntp.org
      dns_servers:
        - 8.8.8.8
        - 8.8.4.4
