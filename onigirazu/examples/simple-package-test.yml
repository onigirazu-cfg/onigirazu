---
# Simple Package Test
# Test basic package functionality

plays:
  - name: "Simple Package Test"
    hosts: all
    tasks:
      # Test tree (should be installed)
      - name: "Test tree command"
        command:
          command: "tree --version"
      - name: "Test tree on /tmp directory"
        command:
          command: "tree /tmp -L 1"
      # Test nano (should NOT be available)
      - name: "Test if nano is available"
        command:
          command: "which nano || echo 'nano not found - correctly removed'"
      # Test other installed packages
      - name: "Test jq"
        command:
          command: "jq --version"
      - name: "Test htop version"
        command:
          command: "htop --version"
      - name: "Test vim"
        command:
          command: "vim --version | head -1"