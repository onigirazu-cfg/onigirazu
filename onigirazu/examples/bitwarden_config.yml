# Onigirazu configuration file with Bitwarden integration
# Save as: onigirazu.yml or ~/.config/onigirazu/config.yml

# General settings
max_concurrency: 10
default_timeout: 30s
retry_attempts: 3
retry_delay: 5s
log_level: info
log_format: text

# SSH settings
ssh_timeout: 30s
ssh_keepalive: 10s
ssh_max_sessions: 10
connection_reuse: true

# Cache settings
enable_cache: true
cache_ttl: 300s

# Secret providers configuration
secrets:
  # Bitwarden configuration
  bitwarden:
    enabled: true
    server: "https://vault.bitwarden.com"  # Or your self-hosted instance
    # Authentication options (choose one):
    # Option 1: Use environment variable BW_SESSION (recommended)
    # Option 2: Provide session token directly
    # session_token: "your-session-token-here"
    # Option 3: Provide email/password (less secure)
    # email: "your-email@example.com"
    # password: "your-password"
    cache_ttl: 300  # Cache secrets for 5 minutes

  # Vault configuration (optional)
  vault:
    enabled: false
    address: "https://vault.example.com:8200"
    token: "your-vault-token"
    # auth_method: "token"  # or "approle", "kubernetes", etc.

# Monitoring
enable_metrics: false
metrics_port: 9090
metrics_path: "/metrics"
enable_profiling: false

# Security
allow_shell_commands: true
blocked_commands:
  - "rm -rf /"
  - "mkfs"
  - "dd if=/dev/zero"

# Module preferences
preferred_module_syntax: "flat"  # or "nested"
enforce_module_syntax: false
