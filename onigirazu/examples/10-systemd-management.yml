---
# Systemd Management Examples
# This playbook demonstrates systemd module capabilities

- name: Systemd Management Demo
  hosts: all
  tasks:
    # Service Management
    - name: Start and enable nginx service
      systemd:
        operation: service
        name: nginx
        state: started
        enabled: true

    - name: Restart apache2 service
      systemd:
        operation: service
        name: apache2
        state: restarted

    - name: Stop and disable mysql service
      systemd:
        operation: service
        name: mysql
        state: stopped
        enabled: false

    - name: Mask a service to prevent it from starting
      systemd:
        operation: service
        name: snapd
        masked: true

    # Unit File Management
    - name: Create custom systemd service unit
      systemd:
        operation: unit
        name: myapp.service
        state: present
        content: |
          [Unit]
          Description=My Application
          After=network.target

          [Service]
          Type=simple
          User=www-data
          WorkingDirectory=/opt/myapp
          ExecStart=/opt/myapp/start.sh
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start custom service
      systemd:
        operation: service
        name: myapp
        state: started
        enabled: true

    - name: Remove custom service unit
      systemd:
        operation: unit
        name: myapp.service
        state: absent

    # Timer Management
    - name: Create systemd timer for backup
      systemd:
        operation: unit
        name: backup.timer
        state: present
        content: |
          [Unit]
          Description=Daily Backup Timer

          [Timer]
          OnCalendar=daily
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Create backup service unit
      systemd:
        operation: unit
        name: backup.service
        state: present
        content: |
          [Unit]
          Description=Backup Service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/backup.sh

    - name: Enable and start backup timer
      systemd:
        operation: timer
        name: backup.timer
        state: started
        enabled: true

    # Daemon Reload
    - name: Reload systemd daemon after changes
      systemd:
        operation: daemon-reload

    # Status Check
    - name: Get service status
      systemd:
        operation: status
        name: nginx
      register: nginx_status

    - name: Display nginx status
      debug:
        var: nginx_status
