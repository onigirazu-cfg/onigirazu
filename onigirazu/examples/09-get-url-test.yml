---
plays:
  - name: Test Get URL Module
    hosts: localhost
    gather_facts: false
    tasks:
      # Setup: Create test directory
      - name: Create test directory
        file:
          path: /tmp/get-url-test
          state: directory
          mode: "0755"

      # Test 1: Download a small HTML file
      - name: Download example.com homepage
        get_url:
          url: http://example.com/
          dest: /tmp/get-url-test/example.html
          mode: "0644"

      # Test 2: Download same file again (should be idempotent)
      - name: Download same file again (idempotent check)
        get_url:
          url: http://example.com/
          dest: /tmp/get-url-test/example.html
          mode: "0644"

      # Test 3: Force download even if file exists
      - name: Force download even if file exists
        get_url:
          url: http://example.com/
          dest: /tmp/get-url-test/example-forced.html
          force: true
          mode: "0644"

      # Test 4: Download with backup
      - name: Download with backup
        get_url:
          url: http://example.com/
          dest: /tmp/get-url-test/example-backup.html
          backup: true
          force: true
          mode: "0644"

      # Test 5: Download with custom timeout
      - name: Download with custom timeout
        get_url:
          url: http://example.com/
          dest: /tmp/get-url-test/example-timeout.html
          timeout: 10
          mode: "0644"

      # Verification: Check downloaded files
      - name: Verify example.html exists
        stat:
          path: /tmp/get-url-test/example.html
        register: example_stat

      - name: Display example.html info
        debug:
          msg: "example.html exists: {{ example_stat.stat.exists }}, size: {{ example_stat.stat.size }} bytes"

      - name: Verify example-timeout.html exists
        stat:
          path: /tmp/get-url-test/example-timeout.html
        register: timeout_stat

      - name: Display example-timeout.html info
        debug:
          msg: "example-timeout.html exists: {{ timeout_stat.stat.exists }}, size: {{ timeout_stat.stat.size }} bytes"

      # Cleanup
      - name: Cleanup test directory
        file:
          path: /tmp/get-url-test
          state: absent
