---
# Example playbook demonstrating Bitwarden integration
#
# Prerequisites:
# 1. Install Bitwarden CLI: https://bitwarden.com/help/cli/
# 2. Login to Bitwarden: bw login
# 3. Unlock vault and export session: export BW_SESSION=$(bw unlock --raw)
# 4. Or configure session token in onigirazu config

- name: "Deploy application with Bitwarden secrets"
  hosts: webservers

  # Configure secret providers
  secrets:
    - type: bitwarden
      config:
        server: "https://vault.bitwarden.com"  # Optional, defaults to bitwarden.com
        # session_token: "your-session-token"   # Optional, uses BW_SESSION env var if not set
        cache_ttl: 300                          # Cache secrets for 5 minutes

  vars:
    app_name: "myapp"
    app_version: "1.0.0"

  tasks:
    # Example 1: Use Bitwarden secret for database password
    - name: "Configure database connection"
      template:
        src: "database.conf.j2"
        dest: "/etc/myapp/database.conf"
        mode: "0600"
      vars:
        db_host: "db.example.com"
        db_user: "{{ bitwarden('database-credentials', 'username') }}"
        db_password: "{{ bitwarden('database-credentials', 'password') }}"

    # Example 2: Use Bitwarden secret for API key
    - name: "Configure API credentials"
      lineinfile:
        path: "/etc/myapp/api.conf"
        regexp: "^API_KEY="
        line: "API_KEY={{ bitwarden('api-credentials', 'api_key') }}"
        mode: "0600"

    # Example 3: Use Bitwarden secret for SSH key
    - name: "Deploy SSH private key"
      copy:
        content: "{{ bitwarden('ssh-keys', 'private_key') }}"
        dest: "/home/{{ ansible_user }}/.ssh/id_rsa"
        mode: "0600"

    # Example 4: Use custom field from Bitwarden
    - name: "Configure SSL certificate"
      copy:
        content: "{{ bitwarden('ssl-certificates', 'certificate') }}"
        dest: "/etc/ssl/certs/myapp.crt"
        mode: "0644"

    # Example 5: Multiple secrets in one task
    - name: "Configure application"
      template:
        src: "app.conf.j2"
        dest: "/etc/myapp/app.conf"
        mode: "0600"
      vars:
        smtp_host: "smtp.example.com"
        smtp_user: "{{ bitwarden('smtp-credentials', 'username') }}"
        smtp_password: "{{ bitwarden('smtp-credentials', 'password') }}"
        jwt_secret: "{{ bitwarden('app-secrets', 'jwt_secret') }}"
        encryption_key: "{{ bitwarden('app-secrets', 'encryption_key') }}"

    # Example 6: Use notes field
    - name: "Deploy license file"
      copy:
        content: "{{ bitwarden('license-key', 'notes') }}"
        dest: "/etc/myapp/license.txt"
        mode: "0644"

    # Example 7: Generic secret function (works with any provider)
    - name: "Configure with generic secret function"
      debug:
        msg: "Secret value: {{ secret('bitwarden', 'test-item', 'password') }}"

---
# Example template file: database.conf.j2
#
# [database]
# host = {{ db_host }}
# port = 5432
# username = {{ db_user }}
# password = {{ db_password }}
# database = {{ app_name }}
# ssl_mode = require

---
# Example template file: app.conf.j2
#
# [app]
# name = {{ app_name }}
# version = {{ app_version }}
#
# [smtp]
# host = {{ smtp_host }}
# username = {{ smtp_user }}
# password = {{ smtp_password }}
#
# [security]
# jwt_secret = {{ jwt_secret }}
# encryption_key = {{ encryption_key }}
