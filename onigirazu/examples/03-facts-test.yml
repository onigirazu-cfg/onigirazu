---
plays:
  - name: "Test Facts Gathering"
    hosts: "all"
    gather_facts: true

    tasks:
      - name: "Display OS Family"
        debug:
          msg: "OS Family: {{ onigirazu_os_family }}"
      - name: "Display Distribution"
        debug:
          msg: "Distribution: {{ onigirazu_distribution }} {{ onigirazu_distribution_version }}"
      - name: "Display Architecture"
        debug:
          msg: "Architecture: {{ onigirazu_architecture }}"
      - name: "Display Kernel"
        debug:
          msg: "Kernel: {{ onigirazu_kernel }} {{ onigirazu_kernel_version }}"
      - name: "Display Hardware"
        debug:
          msg: "CPU Cores: {{ onigirazu_processor_cores }}, Memory: {{ onigirazu_memtotal_mb }}"
      - name: "Display Network"
        debug:
          msg: "FQDN: {{ onigirazu_fqdn }}, IP: {{ onigirazu_default_ipv4.address }}"
      - name: "Install package based on OS family"
        package:
          name: "htop"
          state: "present"
        when: "onigirazu_os_family == 'Debian'"
