---
# Final Package Verification
# Verify the actual state of packages

plays:
  - name: "Package Verification"
    hosts: all
    tasks:
      # Test installed packages (should work)
      - name: "Verify tree is working"
        command:
          command: "tree --version"
      - name: "Verify jq is working"
        command:
          command: "jq --version"
      - name: "Verify htop is working"
        command:
          command: "htop --version"
      - name: "Verify vim is working"
        command:
          command: "vim --version | head -1"
      - name: "Verify git is working"
        command:
          command: "git --version"
      - name: "Verify curl is working"
        command:
          command: "curl --version | head -1"
      - name: "Verify wget is working"
        command:
          command: "wget --version | head -1"
      # Test tree functionality
      - name: "Demonstrate tree functionality"
        command:
          command: "tree /usr/bin -L 1 | head -10"