run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/onigirazu-cfg/onigirazu)
  goimports:
    local-prefixes: github.com/onigirazu-cfg/onigirazu
  lll:
    line-length: 140
  misspell:
    locale: US
  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: false
    require-specific: false

linters:
  enable:
    # Only critical formatting and style issues
    - gofmt
    - goimports
    - gci
    - misspell
    - nolintlint

  disable:
    # Disable all linters that require compilation or are too strict for CI
    - typecheck
    - unused
    - ineffassign
    - staticcheck
    - gosimple
    - govet
    - errcheck
    - bodyclose
    - depguard
    - dogsled
    - copyloopvar
    - gochecknoinits
    - gocritic
    - goprintffuncname
    - gosec
    - rowserrcheck
    - stylecheck
    - unconvert
    - unparam
    - noctx
    - dupl
    - funlen
    - gocyclo
    - goconst
    - mnd
    - nakedret
    - lll
    - whitespace

issues:
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  exclude-dirs:
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - mnd
        - funlen
        - goconst
    - path: cmd/
      linters:
        - mnd
    - linters:
        - lll
      source: "^//go:generate "

  exclude-use-default: false
  exclude:
    - 'declaration of "(err|ctx)" shadows declaration at'
    - 'shadow: declaration of "err" shadows declaration'
  max-issues-per-linter: 10
  max-same-issues: 3
  new: false
