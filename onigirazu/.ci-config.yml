# CI/CD Configuration for Onigirazu
# This file contains configuration settings for the CI/CD pipeline

# Project information
project:
  name: "onigirazu"
  description: "Configuration management tool inspired by Ansible"
  homepage: "https://github.com/your-username/onigirazu"

# Build configuration
build:
  go_version: "1.22"
  supported_versions: ["1.22", "1.23", "1.24"]
  platforms:
    - "linux/amd64"
    - "linux/arm64"
    - "darwin/amd64"
    - "darwin/arm64"
    - "windows/amd64"
    - "freebsd/amd64"

# Testing configuration
testing:
  coverage_threshold: 70
  race_detection: true
  integration_tests: true
  benchmark_tests: true

# Quality gates
quality:
  lint_enabled: true
  security_scan: true
  dependency_check: true
  code_complexity_check: true
  documentation_check: true

# Release configuration
release:
  auto_release: true
  conventional_commits: true
  changelog_generation: true
  prerelease_pattern: "(alpha|beta|rc)"

  # Package managers
  package_managers:
    homebrew: true
    apt: true
    rpm: true
    docker: true

  # Signing
  signing:
    enabled: true
    cosign: true
    gpg: true

  # SBOM generation
  sbom:
    enabled: true
    format: "spdx-json"

# Security configuration
security:
  codeql: true
  dependency_review: true
  vulnerability_scanning:
    - "gosec"
    - "trivy"
    - "govulncheck"
    - "nancy"

  # SARIF reporting
  sarif_upload: true

# Notification configuration
notifications:
  slack:
    enabled: false
    webhook_url: ""
    channels:
      - "#releases"
      - "#ci-cd"

  email:
    enabled: false
    recipients: []

  github:
    enabled: true
    release_notes: true

# Docker configuration
docker:
  registry: "docker.io"
  namespace: "your-username"
  multi_arch: true
  platforms:
    - "linux/amd64"
    - "linux/arm64"

# Dependency management
dependencies:
  auto_update: true
  update_schedule: "weekly"
  update_types: ["patch", "minor"]
  security_updates: true

# Performance monitoring
performance:
  benchmarks: true
  memory_profiling: true
  cpu_profiling: true

# Documentation
documentation:
  auto_generate: true
  coverage_check: true
  api_docs: true
