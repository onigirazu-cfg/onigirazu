---
name: "CLI Demo Playbook"
plays:
  - name: "Configure Web Servers"
    hosts: webservers
    become: true
    gather_facts: true

    tasks:
      - name: "Install nginx"
        package:
          name: nginx
          state: present

      - name: "Start nginx service"
        service:
          name: nginx
          state: started
          enabled: true

      - name: "Copy nginx config"
        copy:
          src: /etc/nginx/nginx.conf
          dest: /etc/nginx/nginx.conf.backup
          mode: "0644"

      - name: "Create web directory"
        file:
          path: /var/www/html
          state: directory
          mode: "0755"

  - name: "Configure Database Servers"
    hosts: dbservers
    become: true

    tasks:
      - name: "Install PostgreSQL"
        package:
          name: postgresql
          state: present

      - name: "Start PostgreSQL service"
        service:
          name: postgresql
          state: started
          enabled: true

      - name: "Create database user"
        command:
          cmd: "createuser -s dbadmin"
