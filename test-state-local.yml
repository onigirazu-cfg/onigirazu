---
# Local test playbook for testing state file serialization
plays:
  - name: "State File Test"
    hosts: localhost_group
    tasks:
      - name: "Test debug module"
        debug:
          msg: "Testing state file serialization"

      - name: "Get current date"
        command:
          cmd: "date"
        register: current_date

      - name: "Create test file"
        file:
          path: "/tmp/onigirazu-state-test.txt"
          state: "present"
          content: "State file test - OK"
          mode: "0644"

      - name: "Verify file exists"
        stat:
          path: "/tmp/onigirazu-state-test.txt"
        register: file_stat

      - name: "Display results"
        debug:
          msg: "File exists: {{ file_stat.stat.exists }}"

      - name: "Cleanup"
        file:
          path: "/tmp/onigirazu-state-test.txt"
          state: "absent"
