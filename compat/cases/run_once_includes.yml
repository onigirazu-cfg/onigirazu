# compat-hosts: 4
# run_once on includes, imports and blocks: once per serial batch, on its first host
- hosts: all
  gather_facts: false
  serial: 2
  order: inventory
  tasks:
    - include_tasks: tasks/once.yml
      run_once: true
    - debug: {msg: "registered {{ oncereg is defined }}"}
    - name: when false on the first host of the batch
      include_tasks: tasks/once.yml
      run_once: true
      when: inventory_hostname != ansible_play_batch[0]
    - include_role: {name: once}
      run_once: true
    - import_role: {name: once}
      run_once: true
    - block:
        - debug: {msg: "block once on {{ inventory_hostname }}"}
          register: blockreg
      run_once: true
    - debug: {msg: "block registered {{ blockreg is defined }}"}
  post_tasks:
    - include_tasks: tasks/once.yml
      run_once: true
      when: ansible_play_batch[-1] == ansible_play_hosts_all[-1]
