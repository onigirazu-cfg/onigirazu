run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number

linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/onigirazu-cfg/onigirazu)
  goimports:
    local-prefixes: github.com/onigirazu-cfg/onigirazu
  lll:
    line-length: 140
  misspell:
    locale: US

linters:
  enable:
    - gofmt
    - goimports
    - gci
    - lll
    - misspell
    - whitespace

issues:
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  exclude-dirs:
    - vendor
