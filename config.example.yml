# Onigirazu Configuration Example
# Copy this file to ~/.onigirazu/config.yml or /etc/onigirazu/config.yml

# Execution settings
execution:
  # Maximum number of concurrent tasks
  max_concurrency: 10

  # Default timeout for tasks (in seconds)
  default_timeout: 300

  # Number of retry attempts for failed tasks
  retry_attempts: 3

  # Delay between retries (in seconds)
  retry_delay: 5

# Logging settings
logging:
  # Log level: debug, info, warn, error
  level: info

  # Log format: text, json
  format: text

  # Log file path (optional, logs to stdout if not set)
  # file: /var/log/onigirazu/onigirazu.log

# State management
state:
  # State file location
  file: .onigirazu-state

  # Enable state backup
  backup: true

  # Number of backups to keep
  backup_count: 5

# Security settings
security:
  # Allow shell command execution
  allow_shell_commands: true

  # Blocked commands (will not be executed)
  blocked_commands:
    - rm -rf /
    - mkfs
    - dd if=/dev/zero

  # Enable checksum verification for files
  enable_checksum: true

# Cache settings
cache:
  # Enable caching
  enabled: true

  # Cache TTL (in seconds)
  ttl: 300

  # Cache directory
  # directory: ~/.onigirazu/cache

# SSH settings (for remote hosts)
ssh:
  # Default SSH user
  # user: root

  # Default SSH port
  port: 22

  # SSH key path
  # key_file: ~/.ssh/id_rsa

  # SSH connection timeout (in seconds)
  timeout: 30

  # Enable SSH agent forwarding
  agent_forwarding: false

  # Strict host key checking
  strict_host_key_checking: true

# Module settings
modules:
  # Package module settings
  package:
    # Update cache before installing packages
    update_cache: true

    # Cache valid time (in seconds)
    cache_valid_time: 3600

  # Service module settings
  service:
    # Service manager: systemd, sysvinit, auto
    manager: auto

  # Git module settings
  git:
    # Default depth for git clone
    depth: 1

    # Enable recursive submodule cloning
    recursive: false

# Performance settings
performance:
  # Enable parallel execution
  parallel: true

  # Worker pool size
  worker_pool_size: 10

  # Enable pipelining (reduces SSH overhead)
  pipelining: true

# Notification settings (optional)
notifications:
  # Enable notifications
  enabled: false

  # Notification webhook URL
  # webhook_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL

  # Notify on success
  on_success: true

  # Notify on failure
  on_failure: true
