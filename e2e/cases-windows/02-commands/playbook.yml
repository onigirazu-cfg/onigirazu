- hosts: windows
  gather_facts: false
  tasks:
    - win_command: whoami
      register: who
      changed_when: false
    - ansible.windows.win_shell: |
        $x = 1..3 | ForEach-Object { $_ * 2 }
        $x -join ','
      register: sh
      changed_when: false
    - win_shell: echo %COMPUTERNAME%
      args: {executable: cmd}
      register: cmd
      changed_when: false
    - win_powershell:
        script: |
          param($Name)
          $Ansible.Changed = $false
          Write-Warning "careful"
          $Ansible.Result = @{ greeting = "hello $Name"; ps = $PSVersionTable.PSVersion.ToString() }
        parameters: {Name: e2e}
      register: ps
    - win_command: cmd /c exit 3
      register: rc3
      changed_when: false
      ignore_errors: true
    - assert:
        that:
          - who.stdout | lower is search('e2e')
          - sh.stdout_lines[0] == '2,4,6'
          - cmd.stdout | trim | length > 0
          - ps.result.greeting == 'hello e2e'
          - ps.result.ps is version('5.1', '>=')
          - ps.warning == ['careful']
          - rc3.rc == 3
          - rc3 is failed
