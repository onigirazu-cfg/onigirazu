- hosts: ssh
  tasks:
    - win_ping:
    - assert:
        that: [ansible_os_family == "Windows"]
    - win_command: cmd /c set "A=over ssh" && echo %A%
      register: c
      changed_when: false
    - win_shell: (Get-Service sshd).Status
      register: s
      changed_when: false
    - win_copy: {dest: C:\e2e\ssh\copied.txt, content: "{{ 'x' * 200000 }}"}
    - assert:
        that:
          - c.stdout | trim == 'over ssh'
          - s.stdout | trim == 'Running'
