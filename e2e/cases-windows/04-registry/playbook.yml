- hosts: windows
  gather_facts: false
  tasks:
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E, name: dw, data: 0xFFFFFFFF, type: dword}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E, name: qw, data: 42, type: qword}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E, name: s, data: plain text, type: string}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E, name: ex, data: '%SystemRoot%\x', type: expandstring}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E, name: m, data: [a, b, c], type: multistring}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E, name: b, data: [0, 255, 16], type: binary}
