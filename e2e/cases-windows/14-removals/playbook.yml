# every run creates and removes again: the removals change each time
- hosts: windows
  gather_facts: false
  tasks:
    - win_file: {path: C:\e2e\gone, state: directory}
    - win_file: {path: C:\e2e\gone, state: absent}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E\Gone, name: x, data: 1, type: dword}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E\Gone, state: absent}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E, name: tmp, data: 1, type: dword}
    - win_regedit: {path: HKLM:\Software\OnigirazuE2E, name: tmp, state: absent}
    - win_powershell:
        script: |
          if (Get-LocalUser -Name e2e-removed -ErrorAction SilentlyContinue) { $Ansible.Changed = $false }
          else { New-LocalUser -Name e2e-removed -NoPassword | Out-Null }
    - win_group_membership: {name: Backup Operators, members: [e2e-removed], state: present}
    - win_group_membership: {name: Backup Operators, members: [e2e-removed], state: absent}
