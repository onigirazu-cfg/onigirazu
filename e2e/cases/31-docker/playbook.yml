plays:
  - name: docker
    hosts: all
    become: true
    tasks:
      - name: Image
        docker_image:
          name: alpine
          tag: "3.20"
          state: present
        # Docker Hub fails now and then
        retries: 3
        delay: 10
      - name: Container
        docker_container:
          name: onigirazu-e2e
          image: alpine:3.20
          command: sleep 3600
          state: present
      # the docker_resource_limits pattern: limits on a running container change in place
      - name: Limits on the running container
        docker_container:
          name: onigirazu-e2e
          image: alpine:3.20
          state: present
          comparisons:
            image: ignore
          cpus: "0.5"
          memory: 64m
        register: limited
      - name: Limits applied once
        docker_container:
          name: onigirazu-e2e
          image: alpine:3.20
          state: present
          cpus: 0.5
          memory: 64M
        register: again
      - name: Second pass changes nothing
        assert:
          that:
            - limited is changed
            - again is not changed
