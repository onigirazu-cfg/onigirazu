plays:
  - name: loops
    hosts: all
    become: true
    gather_facts: true
    vars:
      e2e_users:
        - {name: ann, keys: [k1, k2]}
        - {name: bob, keys: [k3]}
        - {name: cid}
    tasks:
      - name: Plain list
        file:
          path: "/root/onigirazu-e2e-loop/{{ item }}"
          state: directory
        loop: [a, b]
      - name: Items from a command
        command:
          cmd: "printf 'x\\ny\\n'"
        register: names
        changed_when: false
      - name: Registered lines, custom variable, loop metadata
        copy:
          content: "{{ loop.index }}/{{ loop.length }} {{ name }} {{ onigirazu_distribution }}\n"
          dest: "/root/onigirazu-e2e-loop/{{ name }}.txt"
        loop:
          items: "{{ names.stdout_lines }}"
          var: name
        register: written
      - name: Registered loop results
        copy:
          content: "{{ written.results | length }}\n"
          dest: /root/onigirazu-e2e-loop/results
      - name: when per item
        file:
          path: "/root/onigirazu-e2e-loop/when-{{ item }}"
          state: directory
        loop: [keep, skip]
        when: item != "skip"
      # templates inside the items render, as Ansible templates the whole list
      - name: Nested templates in items
        copy:
          content: "{{ item.value }}\n"
          dest: "/root/onigirazu-e2e-loop/{{ item.name }}"
        loop:
          - {name: nested, value: "{{ ansible_os_family | lower }}"}
      # registered results are data: the braces of the command stay
      - name: A command with literal braces
        command: "echo '{{ '{{' }} .Id {{ '}}' }}'"
        register: braces
        changed_when: false
        loop: [one]
      - name: Loop over the registered results
        copy:
          content: "{{ item.stdout }}\n"
          dest: /root/onigirazu-e2e-loop/braces
        loop: "{{ braces.results }}"
      # with_<lookup> loops, as in Ansible
      - name: query('nested') gives the same combinations
        lineinfile:
          path: /root/onigirazu-e2e-loop/with
          line: "{{ item }}"
          create: true
        loop:
          - "combinations {{ query('nested', [1, 2], ['a', 'b']) | length }}"
      - name: with_nested
        lineinfile:
          path: /root/onigirazu-e2e-loop/with
          line: "nested {{ item[0] }}-{{ item[1] }}"
        with_nested: [[1, 2], [a, b]]
      - name: with_together
        lineinfile:
          path: /root/onigirazu-e2e-loop/with
          line: "together {{ item[0] }}-{{ item[1] }}"
        with_together: [[a, b], [1, 2]]
      - name: with_subelements
        lineinfile:
          path: /root/onigirazu-e2e-loop/with
          line: "sub {{ item[0].name }}-{{ item[1] }}"
        with_subelements: ["{{ e2e_users }}", keys, {skip_missing: true}]
      - name: with_indexed_items
        lineinfile:
          path: /root/onigirazu-e2e-loop/with
          line: "indexed {{ item[0] }}-{{ item[1] }}"
        with_indexed_items: [x, y]
