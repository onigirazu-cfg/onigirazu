plays:
  - name: random with a seed is stable per host
    hosts: all
    become: true
    tasks:
      - name: A cron line at a host-specific minute
        copy:
          content: "{{ 60 | random(seed=inventory_hostname) }} 3 * * * root /bin/true\n"
          dest: /etc/cron.d/onigirazu-e2e-random
      - name: One of the items
        set_fact: {picked: "{{ ['a', 'b', 'c'] | random }}"}
      - name: Picked
        assert: {that: "picked in ['a', 'b', 'c']"}
