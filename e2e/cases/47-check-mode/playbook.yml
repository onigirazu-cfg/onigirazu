plays:
  - name: check mode per task
    hosts: all
    become: true
    tasks:
      - name: Checked copy reports the change and writes nothing
        copy:
          content: "would be\n"
          dest: /root/onigirazu-e2e-check-copy
        check_mode: true
        register: checked
      - name: Checked command is skipped
        command:
          cmd: "touch /root/onigirazu-e2e-check-command"
        check_mode: true
      - name: Checked user
        user: {name: onigirazu-e2e-check, state: present}
        check_mode: true
        register: u
      - name: Checked group
        group: {name: onigirazu-e2e-check, state: present}
        check_mode: true
        register: g
      - name: Checked package
        apt: {name: cowsay, state: present}
        check_mode: true
        register: p
        when: onigirazu_os_family == "Debian"
      - name: Checked service stop
        service: {name: cron, state: stopped}
        check_mode: true
        register: s
      - name: Checked sysctl
        sysctl: {name: vm.swappiness, value: "7"}
        check_mode: true
        register: k
      - name: Checked cron.d file
        cron: {operation: system, name: onigirazu-e2e-check, content: "* * * * * root true"}
        check_mode: true
        register: c
      - name: Checked clone
        git: {repo: "https://github.com/onigirazu-cfg/onigirazu.git", dest: /opt/onigirazu-e2e-check-clone, version: v1.63.1}
        check_mode: true
        register: gc
      - name: Checked download
        get_url: {url: "https://raw.githubusercontent.com/onigirazu-cfg/onigirazu/main/README.md", dest: /root/onigirazu-e2e-check-readme}
        check_mode: true
        register: gu
      - name: Checked unit file
        systemd:
          operation: unit
          name: onigirazu-e2e-check.service
          content: "[Service]\nExecStart=/bin/true\n"
        check_mode: true
        register: su
      - name: Checked systemd stop
        systemd: {operation: service, name: cron, state: stopped}
        check_mode: true
        register: ss
      - name: Record what check mode reported
        copy:
          content: "{{ checked.changed }} {{ u.changed }} {{ g.changed }} {{ s.changed }} {{ k.changed }} {{ c.changed }} {{ gc.changed }} {{ gu.changed }} {{ su.changed }} {{ ss.changed }}\n"
          dest: /root/onigirazu-e2e-check-report
