plays:
  - name: check mode per task
    hosts: all
    become: true
    tasks:
      - name: Checked copy reports the change and writes nothing
        copy:
          content: "would be\n"
          dest: /root/onigirazu-e2e-check-copy
        check_mode: true
        register: checked
      - name: Checked command is skipped
        command:
          cmd: "touch /root/onigirazu-e2e-check-command"
        check_mode: true
      - name: Checked user
        user: {name: onigirazu-e2e-check, state: present}
        check_mode: true
        register: u
      - name: Checked group
        group: {name: onigirazu-e2e-check, state: present}
        check_mode: true
        register: g
      - name: Checked package
        apt: {name: cowsay, state: present}
        check_mode: true
        register: p
        when: onigirazu_os_family == "Debian"
      - name: Checked service stop
        service: {name: cron, state: stopped}
        check_mode: true
        register: s
      - name: Checked sysctl
        sysctl: {name: vm.swappiness, value: "7"}
        check_mode: true
        register: k
      - name: Checked cron.d file
        cron: {operation: system, name: onigirazu-e2e-check, content: "* * * * * root true"}
        check_mode: true
        register: c
      - name: Record what check mode reported
        copy:
          content: "{{ checked.changed }} {{ u.changed }} {{ g.changed }} {{ s.changed }} {{ k.changed }} {{ c.changed }}\n"
          dest: /root/onigirazu-e2e-check-report
