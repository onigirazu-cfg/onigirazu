plays:
  - name: stat fields
    hosts: all
    become: true
    tasks:
      - name: A file
        copy: {content: "hello\n", dest: /root/onigirazu-e2e-sf-file, mode: "0640", owner: root}
      - name: A link
        file: {src: /root/onigirazu-e2e-sf-file, dest: /root/onigirazu-e2e-sf-link, state: link}
      - name: Stat the file
        stat: {path: /root/onigirazu-e2e-sf-file}
        register: f
      - name: Stat the link
        stat: {path: /root/onigirazu-e2e-sf-link, checksum_algorithm: sha256}
        register: l
      - name: Record
        copy:
          dest: /root/onigirazu-e2e-sf-out
          content: |
            {{ f.stat.mode }} {{ f.stat.pw_name }} {{ f.stat.checksum }} {{ f.stat.isreg }}
            {{ l.stat.islnk }} {{ l.stat.lnk_source }}
