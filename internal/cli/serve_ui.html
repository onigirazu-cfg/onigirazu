<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — onigirazu</title>
<style>
/* Tokens: zinc surfaces and semantic status colours. */
:root{color-scheme:light;--bg:#fff;--content:oklch(97% .003 285.8);--card:#fff;--fg:oklch(14.5% .017 285.8);--muted:oklch(44% .015 285.8);--line:oklch(92.2% .007 285.8);--hover:oklch(96% .003 285.8);--primary:#18181b;--primary-fg:#fff;--accent:#245dbe;--selection:#e7efff;--ok:#187446;--ok-bg:#e5f5ec;--warn:#936013;--warn-bg:#fff2d5;--bad:oklch(50% .20 27.3);--bad-bg:#fee9e8;--blue:#245dbe;--blue-bg:#e9f0ff;--violet:#7445ad;--violet-bg:#f1eaff;--grey:#60606b;--grey-bg:#efeff2;--add-bg:#e0f4e8;--remove-bg:#fbe5e5;--add-fg:#17623d;--remove-fg:#942b2b;--destructive:oklch(57.7% .245 27.3);--shadow:0 1px 3px rgb(0 0 0/.1)}

:root[data-theme=dark]{color-scheme:dark;--bg:oklch(14.1% .005 285.8);--content:oklch(11.5% .005 285.8);--card:oklch(20.5% .007 285.8);--fg:oklch(98.5% .002 285.8);--muted:oklch(70.8% .015 285.8);--line:oklch(27.4% .009 285.8);--hover:oklch(24% .007 285.8);--primary:#fafafa;--primary-fg:#18181b;--accent:#9dbbff;--selection:#203773;--ok:#78d4a0;--ok-bg:#16382a;--warn:#f4c277;--warn-bg:#3a2b17;--bad:oklch(70% .19 27.3);--bad-bg:#422324;--blue:#9dbbff;--blue-bg:#1c2b4a;--violet:#c6a7f0;--violet-bg:#322441;--grey:#b8b8c2;--grey-bg:#303036;--add-bg:#163629;--remove-bg:#421f25;--add-fg:#9ce1b4;--remove-fg:#ffb1b1}

*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg);background:var(--content)}
button,input,select{font:inherit}
button,a,input,select,summary{outline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent)}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
svg.icon{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* Application shell. */
.topbar{height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;gap:10px;align-items:center;min-width:200px;color:var(--fg);font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden}
.brand svg{width:28px;height:28px;flex-shrink:0}
.brand span{overflow:hidden;text-overflow:ellipsis}
.search{margin:auto;position:relative;width:min(440px,32vw)}
.search .icon{position:absolute;left:11px;top:10px;color:var(--muted)}
.search input{width:100%;height:36px;padding:7px 35px;border:1px solid var(--line);background:var(--content);border-radius:6px;color:var(--fg)}
.search kbd{position:absolute;right:12px;top:8px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px}
.activity{font-size:12px;color:var(--muted);white-space:nowrap}
.icon-button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid transparent;background:transparent;color:var(--fg);border-radius:6px}
.icon-button:hover{background:var(--hover)}
.user-menu{position:relative}
.user-menu summary{list-style:none}
.user-popover{position:absolute;right:0;top:42px;min-width:210px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.user-popover p{margin:0 0 10px}
.sidebar{position:fixed;left:0;top:56px;bottom:0;width:240px;background:var(--bg);border-right:1px solid var(--line);padding:16px 8px;display:flex;flex-direction:column;z-index:15}
.sidebar nav{display:grid;gap:4px}
.sidebar nav button{display:flex;gap:12px;align-items:center;text-align:left;color:var(--muted);background:none;border:0;padding:10px 14px;border-radius:6px;width:100%}
.sidebar nav button:hover{background:var(--hover);color:var(--fg)}
.sidebar nav button.on{background:var(--line);color:var(--fg);font-weight:600}
.sidebar-foot{margin-top:auto;padding:16px;color:var(--muted);font-size:12px}
.banner{margin-left:240px;padding:8px 28px;border-bottom:1px solid var(--line);background:var(--warn-bg);color:var(--warn);font-size:13px}
.banner.error-banner{background:var(--bad-bg);color:var(--bad)}
main{margin-left:240px;min-width:0;padding:28px}
.page-header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:26px}
.page-header h1{font-size:26px;line-height:1.2;letter-spacing:-.7px;margin:0 0 6px;font-weight:650}
.page-header p{margin:0;color:var(--muted)}
.page-actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menu-button{display:none}
.drawer-scrim{display:none}
.muted{color:var(--muted)}
small{font-size:12px}
h2{font-size:18px;letter-spacing:-.3px}
h3{font-size:15px}
p{margin:12px 0}

/* Components and report content. */
button.run{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);box-shadow:var(--shadow);white-space:nowrap}
button.run:hover:not(:disabled){background:var(--hover)}
button.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
button.primary:hover:not(:disabled){opacity:.85;background:var(--primary)}
.table-scroll{width:100%;max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:14px 0;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:normal;word-break:normal}
th{background:var(--card);color:var(--muted);font-size:12px;font-weight:550;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
.jobs-table td:first-child a{font-weight:600;color:var(--fg)}
.jobs-table{table-layout:fixed;min-width:1000px}
.jobs-table th:nth-child(1){width:140px}
.jobs-table th:nth-child(2){width:80px}
.jobs-table th:nth-child(4){width:120px}
.jobs-table th:nth-child(5){width:160px}
.jobs-table th:nth-child(6){width:180px}
.jobs-table th:nth-child(7){width:150px}
.jobs-table td:nth-child(1),.jobs-table td:nth-child(2){white-space:nowrap}
.jobs-table td.target{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobs-table .job-result .muted{overflow-wrap:anywhere}
.job-actions{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.action-popover{position:fixed;inset:auto;margin:0;padding:6px;min-width:150px;max-width:calc(100vw - 24px);border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.action-popover:popover-open{display:grid;gap:4px}
.action-popover button{justify-content:flex-start}
.jobs-table .job-kind{display:none}
.table-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin:14px 0}
.pagination{display:flex;gap:8px}
.b{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;font-size:11px;line-height:1.5;font-weight:550;border-radius:6px;background:var(--grey-bg);color:var(--grey);white-space:nowrap}
.ok{color:var(--ok);background:var(--ok-bg)}
.drift,.changed,.cancelling,.pending{color:var(--warn);background:var(--warn-bg)}
.refused,.failed,.error,.unreachable,.timed_out{color:var(--bad);background:var(--bad-bg)}
.queued,.running,.check{color:var(--blue);background:var(--blue-bg)}
.scheduled{color:var(--violet);background:var(--violet-bg)}
.cancelled,.rejected,.expired{color:var(--grey);background:var(--grey-bg)}
.recent{display:flex;flex-wrap:wrap;gap:3px;width:100%;max-width:145px;margin-top:7px}
.recent-square{display:block;flex:0 0 7px;height:12px;border:1px solid currentColor;border-radius:2px;background:currentColor;color:var(--grey)}
.recent-square.ok{color:var(--ok)}
.recent-square.drift,.recent-square.changed{color:var(--warn)}
.recent-square.failed,.recent-square.error,.recent-square.timed_out,.recent-square.unreachable{color:var(--bad)}
.recent-square.queued,.recent-square.running{color:var(--blue)}
.recent-square.scheduled{color:var(--violet)}
.recent-square.pending,.recent-square.cancelling{color:var(--warn)}
.recent-square.refused{color:var(--bad)}
.recent-square.check{background:transparent}
.duration-plot{overflow-x:auto}
.sparkline{display:block;width:auto;max-width:none;height:40px;margin-top:12px;border-bottom:1px solid var(--line)}
.sparkline path{fill:var(--muted)}
.sparkline path.ok{fill:var(--ok)}
.sparkline path.drift,.sparkline path.changed{fill:var(--warn)}
.sparkline path.failed,.sparkline path.error,.sparkline path.timed_out{fill:var(--bad)}
.compare-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.compare-warning{color:var(--warn)}
.approval-card,.report-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin:14px 0;box-shadow:var(--shadow)}
.approval-card{border-left:3px solid var(--warn)}
.approval-card p:last-child{margin-bottom:0}
.report-card h2,.report-card h3{margin-top:0}
.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:12px;background:var(--bg)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto;max-height:60vh;max-width:100%;font-size:12px}
.filters{display:flex;align-items:end;gap:12px;flex-wrap:wrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:18px;margin-bottom:20px}
.filters label{display:grid;gap:6px;flex:1 1 130px;min-width:0;color:var(--muted);font-size:12px}
input:not([type=checkbox]),select{min-width:0;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);padding:8px 10px;min-height:36px}
.search input{padding-left:35px;padding-right:35px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
select{padding-right:26px}
.filters input,.filters select{width:100%}
.history-dates{display:flex;align-items:end;flex-wrap:wrap;gap:12px;flex:1 1 100%;min-width:0}
.history-dates label{flex:1 1 220px}
.history-ranges,.history-filter-actions,.history-active{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.history-ranges{flex:1 1 100%}
.history-ranges button,.history-active button{font-size:12px;box-shadow:none}
.history-filter-error{flex:1 1 100%;margin:0;font-size:12px}
.history-active{margin:0 0 12px}
.history-active button{white-space:normal;text-align:left;overflow-wrap:anywhere}
.history-filter-actions{margin-left:auto}
.tabs{display:flex;gap:4px;overflow:auto;flex-wrap:nowrap;border-bottom:1px solid var(--line);margin:16px 0 20px;padding-bottom:8px}
.tabs button.run{border-color:transparent;box-shadow:none;background:none;color:var(--muted)}
.tabs [aria-selected=true]{background:var(--hover)!important;color:var(--fg)!important;border-color:var(--line)!important}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
.error-text{color:var(--bad)}
.missing{color:var(--muted);background:var(--content)}
summary{cursor:pointer}
.task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.task-row>div{min-width:0}
.task-meta{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.task-duration{white-space:nowrap;font-variant-numeric:tabular-nums}
.task-list{margin:0;padding-left:24px}
.task-host summary .muted{display:block;margin-left:16px}
.task-host[open] summary{margin-bottom:8px}
.diff span{display:inline-block;min-width:100%}
.diff-add{background:var(--add-bg);color:var(--add-fg)}
.diff-remove{background:var(--remove-bg);color:var(--remove-fg)}
.inventory-effective{margin-top:8px}
.inventory-effective[open] summary{margin-bottom:8px}
.inventory-var{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 12px;padding:6px 0;border-top:1px solid var(--line)}
.inventory-var strong{grid-column:1/-1}
.inventory-var span{min-width:0;overflow-wrap:anywhere}

/* Job inbox and run sheet. */
.job-split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;min-height:510px}
.run-list{border-right:1px solid var(--line);background:var(--bg);min-width:0}
.run-list .report-card{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:16px;box-shadow:none}
.run-list .compare-controls{padding:0 16px;font-size:12px}
.run-list .compare-controls .muted{max-width:170px}
.run-item{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.run-item.selected{background:var(--selection)}
.run-item:hover{background:var(--hover)}
.run-item.selected:hover{background:var(--selection)}
.run-item a[data-res]{display:block;color:var(--fg);font-weight:600;margin:6px 0}
.run-item .run-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:5px 0;color:var(--muted);font-size:12px}
.run-item .muted{font-size:12px}
.run-item .run-top{display:flex;justify-content:space-between;gap:8px}
.run-detail{min-width:0;padding:20px}
.run-detail>.report-card{margin-top:14px}
.run-detail .toolbar{padding-bottom:14px;border-bottom:1px solid var(--line)}
.run-detail .report-card{padding:18px}
.run-detail .empty{margin-top:100px;border:0}
.run-detail [role=tabpanel]{min-width:0}
.run-detail .table-scroll table{min-width:500px}
.sheet{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:480px;max-width:100%;padding:0;border:0;border-left:1px solid var(--line);background:var(--content);color:var(--fg);box-shadow:-8px 0 40px #0002}
.sheet::backdrop{background:rgb(0 0 0/.45)}
.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-header h2{margin:0}
.sheet-body{padding:0 20px 24px}
.adhoc-form{display:block}
.adhoc-form .report-card{padding:20px}
.adhoc-form label{display:grid;gap:8px;margin:16px 0;font-weight:550}
.adhoc-form label small{font-weight:400}
.adhoc-form label input[type=checkbox]{justify-self:start}
.adhoc-form input,.adhoc-form select{width:100%}
.adhoc-form input[type=checkbox]{width:16px}
.required{color:var(--bad)}
.history-filter-panel>summary{display:none;list-style:none;width:max-content;margin-bottom:12px}
@media(max-width:600px){.history-filter-panel>summary{display:inline-flex}.history-filter-panel:not([open])>summary{margin-bottom:12px}}
.ellipsis{max-width:28rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.limit-picker{min-width:0;max-width:100%}
.limit-chips{display:flex;gap:6px;flex-wrap:wrap}
.limit-chips button{max-width:100%;white-space:normal;overflow-wrap:anywhere;box-shadow:none;font-size:12px}
.limit-chips [aria-pressed=true]{border-color:var(--accent);background:var(--selection);color:var(--accent)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}

@media(max-width:1100px){.activity{max-width:140px;white-space:normal;line-height:1.3}
.brand{min-width:160px}
.topbar{gap:10px;padding:0 16px}
.job-split{grid-template-columns:minmax(240px,300px) minmax(0,1fr)}
main{padding:24px}
.run-detail{padding:16px}
}

@media(max-width:900px){.sidebar{width:64px;padding:16px 6px}
.sidebar nav button{justify-content:center;padding:12px}
.sidebar nav button span,.sidebar-foot{display:none}
main,.banner{margin-left:64px}
.brand{min-width:0;max-width:190px}
.job-split{grid-template-columns:minmax(220px,280px) minmax(0,1fr)}
.search{width:auto;flex:1}
.search input{min-width:100px}
.top-actions{gap:3px}
.activity{display:none}
}

@media(max-width:700px){.job-split{display:block}
.run-list{border-right:0}
.job-split.detail-open .run-list{display:none}
.job-split:not(.detail-open) .run-detail{display:none}
.page-header{align-items:flex-start}
.table-scroll .inventory-hosts-table{display:block;min-width:0}
.inventory-hosts-table tbody{display:block}
.inventory-hosts-table thead{display:none}
.inventory-hosts-table tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
.inventory-hosts-table td{display:block;min-width:0;border:0;padding:8px}
.inventory-hosts-table td::before{content:attr(data-label);display:block;color:var(--muted);font-size:12px}
.inventory-hosts-table .inventory-host-vars{grid-column:1/-1}
}

@media(max-width:600px){.topbar{padding:0 10px;gap:6px}
.brand{font-size:14px;max-width:135px;gap:6px}
.brand svg{width:23px}
.search{min-width:0}
.search input{min-width:0;padding-right:8px;padding-left:28px}
.search kbd{display:none}
.search .icon{left:8px}
.top-actions #pause{font-size:11px;padding:4px 6px}
.top-actions .icon-button{width:28px}
.menu-button{display:inline-flex;flex-shrink:0}
.sidebar{transform:translateX(-100%);width:240px;transition:transform .15s}
.sidebar nav button{justify-content:flex-start}
.sidebar nav button span,.sidebar-foot{display:block}
.drawer-open .sidebar{transform:none}
.drawer-open .drawer-scrim{display:block;position:fixed;inset:56px 0 0;background:#0007;z-index:14;border:0}
main{margin-left:0;padding:20px 12px}
.banner{margin-left:0;padding:8px 12px}
.page-header{margin-bottom:20px}
.page-header h1{font-size:24px}
.page-header p{font-size:12px}
.report-card,.approval-card{padding:16px}
.filters{padding:12px;gap:10px}
.history-filters>label,.history-dates label{flex-basis:100%}
.history-filter-actions{width:100%;margin-left:0}
.history-filter-actions button{flex:1}
.task-row{grid-template-columns:minmax(0,1fr)}
.task-meta{justify-content:flex-start}
.run-detail{padding:12px}
.table-footer{flex-wrap:wrap}
.sheet-body{padding:0 12px 20px}
.nowrap-table td{white-space:nowrap}.nowrap-table td.wrap{white-space:normal;min-width:16rem}
.jobs-scroll{overflow:visible;border:0;background:none;box-shadow:none}
.jobs-table,.jobs-table tbody{display:block;min-width:0;width:100%}
.jobs-table thead{display:none}
.jobs-table tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px;padding:16px;margin-bottom:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.jobs-table td{display:block;min-width:0;padding:0;border:0}
.jobs-table td:nth-child(1){display:flex;align-items:center;grid-row:1;grid-column:1/-1;white-space:nowrap}
.jobs-table td:nth-child(1) a{display:inline-block;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.jobs-table .job-kind{display:inline-flex;flex-shrink:0;margin-left:8px}
.jobs-table td:nth-child(2),.jobs-table td.target{display:none}
.jobs-table .job-result{grid-row:2;grid-column:1/-1}
.jobs-table .job-schedule{grid-row:3;grid-column:2;color:var(--muted)}
.jobs-table .job-last{display:contents}
.jobs-table .last-run-meta{grid-row:3;grid-column:1;color:var(--muted)}
.jobs-table .recent{grid-row:4;grid-column:1/-1;max-width:100%;margin-top:0}
.jobs-table .job-actions-cell{grid-row:5;grid-column:1/-1}

}

@media(prefers-reduced-motion:reduce){*{transition:none!important}
}

</style>
</head>
<body>
<header class="topbar">
<button class="icon-button menu-button" id="menu" aria-controls="main-navigation" aria-label="Open navigation" aria-expanded="false"></button>
<a class="brand" href="#" aria-label="onigirazu home"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M13 5c1.3-2 4.7-2 6 0l10 18c1.5 2.8-.5 6-3.5 6h-19C3.5 29 1.5 25.8 3 23Z" stroke="currentColor" stroke-width="1.7"/><rect x="12" y="19" width="8" height="10" rx="1.5" fill="currentColor"/></svg><span>{{title}}</span></a>
<label class="search"><span id="search-icon"></span><input id="search" type="search" aria-label="Search current list" placeholder="Search…"><kbd>/</kbd></label>

<script>
const $=s=>document.querySelector(s), main=$('#main');
const request=async(p,o={})=>{const headers=new Headers(o.headers), token=readToken();
  if(token)headers.set('Authorization','Bearer '+token);
  return fetch(p,{...o,headers})};
const apiPage=async(p,o)=>{const r=await request(p,o);
  if(!r.ok)throw new Error(r.status+' '+(await r.text()));
  return {data:await r.json(),headers:r.headers}};
const api=async(p,o)=>(await apiPage(p,o)).data;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const span=d=>d<90?Math.round(d)+'s':d<5400?Math.round(d/60)+'m':d<172800?Math.round(d/3600)+'h':Math.round(d/86400)+'d';
const ago=t=>{if(!t)return'';
  const d=(Date.now()-new Date(t))/1000;
  return d<0?'in '+span(-d):span(d)+' ago'};
const badge=s=>{s=s==='failure'?'failed':s==='success'?'ok':s;
  return `<span class="b ${esc(s)}">${esc(s)}</span>`};
let me={operator:false}, view='jobs', timer, progressController;
function stopProgress(){progressController?.abort();progressController=null}
window.addEventListener('pagehide',stopProgress);
function activityView(m){
  $('#storage-error').hidden=!m.storage_error;
  $('#storage-error').textContent=m.storage_error?'Results not saved: '+m.storage_error:'';
  $('#activity').hidden=!(m.running+m.queued+(m.scheduled||0));
  $('#activity').textContent=`${m.running||0} running · ${m.queued||0} queued · ${m.scheduled||0} scheduled`;
}
function pauseView(p){
  me.paused=p.paused;
  $('#pause').hidden=!me.operator;
  $('#pause').textContent=p.paused?'Resume':'Pause';
  $('#pause-banner').hidden=!p.paused;
  $('#pause-banner').textContent=`Paused by ${p.by||''} ${ago(p.at)}: ${p.reason||''}`;
}
$('#pause').onclick=async()=>{
  let reason='';
  if(!me.paused){reason=prompt('Reason (optional)');
  if(reason===null)return}
  try{pauseView(await api(me.paused?'/api/resume':'/api/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})}));
  if(view==='jobs')await jobs()}
  catch(e){alert(e.message)}
};
const paramsView=r=>r.params?`<div class="muted">${r.params.limit?`limit ${esc(r.params.limit)} → ${esc((r.params.hosts||[]).join(', '))}<br>`:''}${Object.keys(r.params.extra_vars||{}).length?'vars '+Object.entries(r.params.extra_vars).map(([k,v])=>esc(k)+'='+esc(v)).join(', '):''}</div>`:'';
const checkBadge=r=>r?.mode==='check'?' '+badge('check'):'';
const hasAdhoc=j=>j?.adhoc?.limit||j?.adhoc?.extra_vars?.length||j?.adhoc?.vars?.length;
function varInput(v){
  const value=v.default??'', attrs=`data-var="${esc(v.name)}" ${v.required&&!v.secret&&v.type!=='bool'?'required':''}`;
  let input;
  if(v.secret)input=`<input type="password" ${attrs} autocomplete="new-password">`;
  else if(v.type==='choice')input=`<select ${attrs}><option value="">Choose…</option>${(v.choices||[]).map(c=>`<option value="${esc(c)}" ${c===value?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  else if(v.type==='bool')input=`<input type="checkbox" ${attrs} ${v.default!=null?`data-default="${esc(v.default)}"`:''} ${value==='true'?'checked':''}>`;
  else input=`<input type="${v.type==='int'?'number':'text'}" ${attrs} value="${esc(value)}" ${v.type==='int'?`step="1" ${v.min!=null?`min="${esc(v.min)}"`:''} ${v.max!=null?`max="${esc(v.max)}"`:''}`:v.pattern?`title="must match ${esc(v.pattern)} (RE2, checked by the server)"`:''}>`;
  return `<label>${esc(v.name)}${v.required?' <span class="required">*</span>':' <small class="muted">(optional)</small>'}${input}${v.description?`<small class="muted">${esc(v.description)}</small>`:''}</label>`;
}
const scheduledTime=t=>`scheduled for ${new Date(t).toLocaleString('en',{weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})}, ${ago(t)}`;
function localRFC3339(value){
  const d=new Date(value), offset=-d.getTimezoneOffset(), pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00${offset<0?'-':'+'}${pad(Math.floor(Math.abs(offset)/60))}:${pad(Math.abs(offset)%60)}`;
}
function targetPicker(form){
  const input=form.querySelector('[data-limit]');
  if(!input||form.dataset.picker)return;
  form.dataset.picker='true';
  const chips=form.querySelector('[data-inventory]'), preview=form.querySelector('[data-preview]'), path='/api/jobs/'+encodeURIComponent(form.dataset.form)+'/inventory';
  let inventory, debounce, revision=0;
  const message=(text,error=false)=>{preview.textContent=text;preview.className=error?'error-text':'muted'};
  const selected=()=>input.value.split(',').map(s=>s.trim()).filter(Boolean);
  const mark=()=>{const values=selected();chips.querySelectorAll('[data-target]').forEach(b=>b.setAttribute('aria-pressed',String(values.includes(b.dataset.target))))};
  const update=async version=>{
    const limit=input.value;
    if(!limit&&inventory){message('→ all '+inventory.hosts.length+' hosts of the job');return}
    try{
      const result=await api(path+'?limit='+encodeURIComponent(limit));
      if(version!==revision)return;
      const hosts=result.hosts, extra=hosts.length-20;
      message(!limit?'→ all '+hosts.length+' hosts of the job':'→ '+hosts.length+' hosts: '+hosts.slice(0,20).join(', ')+(extra>0?' … +'+extra:''));
    }
  catch(e){if(version===revision)message(e.message,true)}
  };
  input.oninput=()=>{mark();clearTimeout(debounce);
  const version=++revision;message('Resolving…');debounce=setTimeout(()=>update(version),300)};
  chips.textContent='Loading inventory…';
  api(path).then(data=>{
    inventory=data;
    chips.innerHTML=data.groups.map(g=>`<button class="run" type="button" data-target="${esc(g.name)}" aria-pressed="false">${esc(g.name)} (${g.hosts.length})</button>`).join('')+data.hosts.map(h=>`<button class="run" type="button" data-target="${esc(h)}" aria-pressed="false">${esc(h)}</button>`).join('');
    chips.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{const values=selected(), target=b.dataset.target;input.value=values.includes(target)?values.filter(v=>v!==target).join(','):values.concat(target).join(',');input.oninput()});
    mark();clearTimeout(debounce);update(++revision);
  }).catch(e=>{chips.textContent=e.message;chips.classList.add('error-text')});
}
function hash(value){if(location.hash!==value){stopProgress();history.pushState(null,'',value||location.pathname+location.search)}}
// Views: job list, run controls, and parameter sheet.
let jobsCache=[], jobContext=null;
const pageHeader=(title,subtitle,actions='')=>`<div class="page-header"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="page-actions">${actions}</div></div>`;
let actionMenuID=0;
function jobActions(j,includeCancel=true){
  if(!j?.allowed)return '';
  const id='job-actions-'+(++actionMenuID), disabled=j.pending||j.running?'disabled':'';
  const cancellations=includeCancel?[...(j.active&&['queued','running'].includes(j.active.status)?[j.active]:[]),...(j.scheduled_runs||(j.scheduled?[j.scheduled]:[]))]:[];
  return `<div class="job-actions"><button class="run primary" data-run="${esc(j.name)}" ${disabled}>${icon('play')} Run</button><button class="run" popovertarget="${id}" aria-label="More actions for ${esc(j.name)}">⋯</button><div class="action-popover" id="${id}" popover><button class="run" data-configure="${esc(j.name)}" ${disabled}>Run…</button><button class="run" data-run-at="${esc(j.name)}" ${j.scheduled||j.pending?'disabled':''}>Run at…</button>${j.kind==='apply'?`<button class="run" data-check="${esc(j.name)}" ${disabled}>Check</button>`:''}${cancellations.map(r=>`<button class="run" data-stop="${esc(r.id)}" data-name="${esc(j.name)}" data-running="${r.status==='running'}">Cancel${r.not_before?' · '+date(r.not_before):''}</button>`).join('')}</div></div>`;
}
function decisionButtons(r,j){return j?.allowed&&r.status==='pending'?`<button class="run primary" data-decision="approve" data-id="${esc(r.id)}">Approve</button><button class="run" data-decision="reject" data-id="${esc(r.id)}">Reject</button>`:''}
async function refreshCurrent(){closeSheet();
  if(view==='result'&&jobContext)return run(jobContext.selected);
  if(view==='results'&&jobContext)return results(jobContext.name,false); // a refresh keeps the history in view
  return jobs()}
function bindJobActions(root=main){
  root.querySelectorAll('[popovertarget]').forEach(button=>{
    const menu=document.getElementById(button.getAttribute('popovertarget'));
    menu.addEventListener('toggle',()=>{
      if(!menu.matches(':popover-open'))return;
      const rect=button.getBoundingClientRect();
      menu.style.left=Math.max(12,Math.min(rect.right-menu.offsetWidth,innerWidth-menu.offsetWidth-12))+'px';
      menu.style.top=Math.max(12,Math.min(rect.bottom+4,innerHeight-menu.offsetHeight-12))+'px';
    });
    menu.addEventListener('click',e=>{if(e.target.closest('button:not(:disabled)'))menu.hidePopover()});
  });
  root.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{let comment='';
  if(b.dataset.decision==='reject'){comment=prompt('Comment (optional)');
  if(comment===null)return}b.disabled=true;
  try{await api('/api/runs/'+encodeURIComponent(b.dataset.id)+'/'+b.dataset.decision,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment})});await refreshCurrent()}
  catch(e){alert(e.message);
  b.disabled=false}});
  root.querySelectorAll('[data-stop]').forEach(b=>b.onclick=async()=>{if(b.dataset.running==='true'&&!confirm('Stop '+b.dataset.name+' now?'))return;
  const comment=prompt('Comment (optional)');
  if(comment===null)return;
  b.disabled=true;
  try{await api('/api/runs/'+encodeURIComponent(b.dataset.stop)+'/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment})});await refreshCurrent()}
  catch(e){alert(e.message);
  b.disabled=false}});
  root.querySelectorAll('[data-run],[data-configure],[data-run-at],[data-check]').forEach(b=>b.onclick=async()=>{
    const name=b.dataset.run||b.dataset.configure||b.dataset.runAt||b.dataset.check,j=jobsCache.find(j=>j.name===name);
    if(b.dataset.configure||b.dataset.runAt||(b.dataset.run&&hasAdhoc(j))){openSheet(j,Boolean(b.dataset.runAt));return}
    b.disabled=true;
  try{await api('/api/jobs/'+encodeURIComponent(name)+'/run',{method:'POST',...(b.dataset.check?{headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'check'})}:{})})}
  catch(e){alert(e.message)}setTimeout(()=>refreshCurrent().catch(showError),500);
  });
}
let sheetTrigger;
function closeSheet(){if($('#run-sheet').open)$('#run-sheet').close();sheetTrigger?.focus()}
function openSheet(j,scheduled=false){
  if(!j)return;sheetTrigger=document.activeElement ;
  $('#sheet-title').textContent=scheduled?'Schedule run':'Run job' ;
  $('#sheet-subtitle').textContent=j.name+' · '+j.kind;
  $('#sheet-content').innerHTML=`<form class="adhoc-form" data-form="${esc(j.name)}"><section class="report-card"><h3>Run settings</h3><p class="muted">Choose the target hosts and execution time.</p>${j.adhoc?.limit?'<div class="limit-picker"><label>Limit <small class="muted">(optional)</small><small class="muted">Leave empty to use every host in this job.</small><input data-limit placeholder="Host or group pattern"></label><div data-inventory class="limit-chips muted"></div><p data-preview class="muted" role="status" aria-live="polite"></p></div>':''}<label>Run at (local time) ${scheduled?'<span class="required">*</span>':'<small class="muted">(optional)</small>'}<small class="muted">Uses this browser’s time zone. Leave empty to run now.</small><input type="datetime-local" data-not-before ${scheduled?'required':''}></label></section>${(j.adhoc?.vars||j.adhoc?.extra_vars||[]).length?`<section class="report-card"><h3>Variables</h3><p class="muted">Values apply to this run only.</p>${(j.adhoc?.vars||(j.adhoc?.extra_vars||[]).map(name=>({name,secret:(j.adhoc?.secret_vars||[]).includes(name)}))).map(varInput).join('')}</section>`:''}<div class="sheet-actions"><button class="run primary" type="submit">${scheduled?'Schedule run':'Run'}</button>${j.kind==='apply'?'<button class="run" type="submit" data-mode="check">Check</button>':''}<button class="run" type="button" data-cancel>Cancel</button></div></form>`;
  const form=$('#sheet-content form');
  form.querySelector('[data-cancel]').onclick=closeSheet;
  form.onsubmit=async e=>{e.preventDefault();
  const body={},vars=Object.create(null),limit=form.querySelector('[data-limit]')?.value;
  if(e.submitter?.dataset.mode==='check')body.mode='check';
  if(limit)body.limit=limit;
  const later=form.querySelector('[data-not-before]').value;
  if(later)body.not_before=localRFC3339(later);form.querySelectorAll('[data-var]').forEach(input=>{if(input.type==='checkbox'){if(input.checked||input.dataset.default!==undefined)vars[input.dataset.var]=String(input.checked)}else if(input.value||input.required)vars[input.dataset.var]=input.value});
  if(Object.keys(vars).length)body.extra_vars=vars;
  const button=e.submitter||form.querySelector('[type="submit"]');
  button.disabled=true;
  try{await api('/api/jobs/'+encodeURIComponent(j.name)+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});await refreshCurrent()}
  catch(e){alert(e.message);
  button.disabled=false}};
  $('#run-sheet').showModal();
  targetPicker(form);(scheduled?form.querySelector('[data-not-before]'):form.querySelector('input,select,button'))?.focus();
}
async function jobs(){
  stopProgress();
  view='jobs';
  hash('');
  setNav('jobs');
  jobContext=null;
  const [list,p,m]=await Promise.all([api('/api/jobs'),api('/api/pause'),api('/api/me')]);
  if(view!=='jobs')return;
  jobsCache=list;
  pauseView(p);
  activityView(m);
  const pending=list.filter(j=>j.pending);
  main.innerHTML=pageHeader('Jobs','Scheduled and on-demand fleet automation')+(pending.length?`<h2>Pending approval <span class="b pending">${pending.length}</span></h2>${pending.map(j=>`<section class="approval-card"><b>${esc(j.name)}</b> · ${esc(j.kind)} · ${esc(j.target)}<br><span class="muted">Requested by ${esc(j.pending.trigger)} ${esc(ago(j.pending.requested))} · expires in ${span(Math.max(0,(new Date(j.pending.approval.expires)-Date.now())/1000))}</span>${j.pending.not_before?`<div class="muted">${esc(scheduledTime(j.pending.not_before))}</div>`:''}${paramsView(j.pending)}<p>${decisionButtons({...j.pending,status:'pending'},j)}</p></section>`).join('')}`:'')+(list.length?`<div class="table-scroll jobs-scroll"><table class="jobs-table"><thead><tr><th>Job</th><th>Kind</th><th class="target">Target</th><th>Schedule</th><th>Last run</th><th>Result</th><th>Actions</th></tr></thead><tbody>${list.map(j=>`<tr data-search="${esc([j.name,j.kind,j.target].join(' '))}"><td><a title="${esc(j.name)}" href="#job/${encodeURIComponent(j.name)}">${esc(j.name)}</a><span class="b job-kind">${esc(j.kind)}</span></td><td>${esc(j.kind)}</td><td class="muted target" title="${esc(j.target)}">${esc(j.target)}</td><td class="job-schedule">${j.every?esc(j.every)+(j.next?'<br><span class="muted">next '+esc(ago(j.next))+'</span>':''):'<span class="muted">On demand</span>'}${j.windows?.length?`<div class="muted">${j.windows.map(esc).join('<br>')} (${esc(j.windows_tz||'UTC')})${j.next_window?'<br>next window '+date(j.next_window):''}</div>`:''}</td><td class="job-last"><div class="last-run-meta">${lastRun(j)}</div>${recentStrip(j.recent)}</td><td class="job-result">${j.pending?badge('pending')+checkBadge(j.pending):j.running?badge(j.active?.status||(j.queued?'queued':'running'))+checkBadge(j.active)+activeTime(j):j.last?badge(j.last.status)+checkBadge(j.last)+'<div class="muted">'+esc(j.last.summary)+'</div>':''}${(j.scheduled_runs||(j.scheduled?[j.scheduled]:[])).map(r=>`<div>${badge('scheduled')}${checkBadge(r)} <a href="#run/${encodeURIComponent(r.id)}">${esc(scheduledTime(r.not_before))}</a>${r.summary?'<br><span class="muted">'+esc(r.summary)+'</span>':''}</div>`).join('')}</td><td class="job-actions-cell">${jobActions(j)}</td></tr>`).join('')}</tbody></table></div>`:empty('No jobs in serve.yml'));
  bindJobActions();
  listFooter(list.length);
  applySearch();
}
function recentStrip(recent){
  return `<div class="recent" aria-label="Recent runs, newest on the right">${(recent||[]).slice(0,20).reverse().map(r=>`<span class="recent-square ${esc(r.status)}${r.mode==='check'?' check':''}" title="${esc(r.status)}${r.mode==='check'?' (check)':''} · ${date(r.started)}"></span>`).join('')}</div>`;
}
function durationChart(list){
  const runs=list.filter(r=>r.started&&!String(r.started).startsWith('0001-')&&['ok','drift','changed','failed','error','cancelled','timed_out'].includes(r.status)).slice(0,50).reverse();
  if(!runs.length)return '';
  const max=Math.max(...runs.map(r=>r.duration_seconds||0)), width=runs.length*8;
  return `<section class="report-card"><div class="muted">Duration · ${runs.length} recent runs · newest right · max ${max.toFixed(1)}s</div><div class="duration-plot"><svg class="sparkline" width="${width}" height="40" viewBox="0 0 ${width} 40" role="img" aria-label="Recent run durations, newest on the right">${runs.map((r,i)=>{const height=Math.max(1,40*(r.duration_seconds||0)/(max||1)),x=i*8,y=40-height,radius=Math.min(2,height);
  return `<path class="${esc(r.status)}" d="M${x} 40V${y+radius}Q${x} ${y} ${x+radius} ${y}H${x+6-radius}Q${x+6} ${y} ${x+6} ${y+radius}V40Z"><title>${esc(r.status)}${r.mode==='check'?' (check)':''} · ${date(r.started)} · ${(r.duration_seconds||0).toFixed(1)}s</title></path>`}).join('')}</svg></div></section>`;
}
function comparisonView(c){
  const items=(label,list)=>`<h3>${esc(label)} (${list.length})</h3>`+(list.length?list.map(i=>`<div class="item">${hostLink(i.host)} · <b>${esc(i.play?i.play+' › ':'')}${esc(i.task)}</b> <span class="muted">${esc(i.module)}</span>${i.key?`<div class="muted">${esc(i.key)}</div>`:''}</div>`).join(''):empty('None'));
  return `<section class="report-card"><h2>Run comparison</h2><p>A: <a href="#run/${encodeURIComponent(c.a.id)}">${date(c.a.started)}</a> ${badge(c.a.status)} → B: <a href="#run/${encodeURIComponent(c.b.id)}">${date(c.b.started)}</a> ${badge(c.b.status)}</p>${c.same_playbook?'':'<p class="compare-warning" role="status">Playbook content differs or a playbook hash is unavailable; task changes may reflect playbook edits.</p>'}<h3>Changed host verdicts (${c.hosts.length})</h3>${c.hosts.length?table(['Host','A','B'],c.hosts.map(h=>`<tr><td>${hostLink(h.host)}</td><td>${h.a?badge(h.a):'<span class="muted">not present</span>'}</td><td>${h.b?badge(h.b):'<span class="muted">not present</span>'}</td></tr>`)):empty('No host verdict changes')}${items('Appeared',c.appeared)}${items('Resolved',c.resolved)}</section>`;
}
function runList(list,job,selected=''){
  const comparable=['drift','apply'].includes(job?.kind),eligible=r=>comparable&&r.started&&!String(r.started).startsWith('0001-')&&['ok','drift','changed','failed','error','cancelled','timed_out'].includes(r.status);
  return durationChart(list)+(comparable&&list.length?'<div class="compare-controls"><button class="run" id="compare" disabled>Compare</button><span class="muted" id="compare-hint">Select two executed runs to compare.</span></div>':'')+(list.length?list.map(r=>`<article class="run-item ${r.id===selected?'selected':''}" data-search="${esc([r.id,r.trigger,r.status,r.summary].join(' '))}"><div><input type="checkbox" data-compare="${esc(r.id)}" aria-label="Select run ${esc(r.id)} for comparison" ${eligible(r)?'':'disabled'}></div><div><div class="run-top"><span>${badge(r.status)}${checkBadge(r)}</span><span class="muted">${esc(ago(r.started||r.requested))}</span></div><a href="#run/${encodeURIComponent(r.id)}" data-res="${esc(r.id)}">${esc(r.trigger||'Run')} · ${date(r.started||r.requested)}</a><p class="run-summary" title="${esc(r.summary)}">${esc(r.summary||'No summary yet')}</p>${paramsView(r)}${r.approval?.decision?'<div class="muted">'+esc(r.approval.decision==='expired'?'expired':r.approval.decision+' by '+r.approval.by)+'</div>':''}<div class="muted">${esc(r.hosts_count)} hosts${r.failed_hosts?' · '+esc(r.failed_hosts)+' failed':''} · ${(r.duration_seconds||0).toFixed(1)}s</div></div></article>`).join(''):empty('No runs yet'));

function bindRunList(name,list,job){

  if(!match)return '';
  const [,year,month,day,hour,minute,second]=match.map(Number);

  main.querySelector('[data-previous]').onclick=()=>{listPage--;
  applySearch()};
  main.querySelector('[data-next]').onclick=()=>{listPage++;
  applySearch()};
}
$('#search').oninput=()=>applySearch(true);
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.closest('input,textarea,select,[contenteditable]')&&!$('#run-sheet').open){e.preventDefault() ;
  $('#search').focus()}if(e.key==='Escape'){drawer(false) ;
  $('#user-menu').open=false}});
const views={jobs,hosts,inventory,runs:()=>runs(),audit};
function show(v){listPage=0;stopProgress();
  closeSheet();
  view=v;
  jobContext=null;
  hash(v==='jobs'?'':'#'+v);
  setNav(v);views[v]().catch(showError)}
document.querySelectorAll('nav [data-v]').forEach(b=>{b.insertAdjacentHTML('afterbegin',icon(b.dataset.v));b.title=b.textContent;b.onclick=()=>show(b.dataset.v)});
function showError(e){main.innerHTML=empty(e.message)}
function route(){
  listPage=0;stopProgress();
  closeSheet();
  let type,id;
  try{const parts=location.hash.slice(1).split('/');type=parts.shift();id=decodeURIComponent(parts.join('/'))}
  catch(e){showError(e);return}
  const kind=type.split('?')[0];
  if(['runs','audit','inventory','hosts'].includes(kind)){view=kind;
  setNav(kind);views[kind]().catch(showError);return}
  if(type==='job'&&id)results(id).catch(showError);else if(type==='run'&&id)run(id).catch(showError);else if(type==='host'&&id)host(id).catch(showError);else if(type==='host-audit'&&id)runs(id).catch(showError);else show('jobs');
}
window.addEventListener('hashchange',route);
api('/api/me').then(m=>{me=m;
  activityView(m);
  pauseView(m);api('/api/pause').then(pauseView).catch(()=>{}) ;
  $('#who').textContent=m.user+(m.operator?' · operator':' · viewer');
  const out=String(m.sign_out_url||'');if(/^(\/(?!\/)|https?:\/\/)/i.test(out)){$('#sign-out').href=out;$('#sign-out').hidden=false}
  route()}).catch(showError);
timer=setInterval(()=>{api('/api/me').then(activityView).catch(()=>{});
  if(view==='jobs'&&!$('#run-sheet').open)jobs().catch(()=>{})},10000);
</script>
</body>
</html>
