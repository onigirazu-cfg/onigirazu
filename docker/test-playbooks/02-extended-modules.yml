---
# Extended Module Testing - Tests additional allowed modules

plays:
  - name: "Template Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Create template source file"
        shell:
          cmd: "cat > /tmp/template_source.j2 << 'EOF'\nApplication: Onigirazu\nVersion: 1.49.0\nEnvironment: testing\nEOF"

      - name: "Render template"
        template:
          src: "/tmp/template_source.j2"
          dest: "/tmp/template_output.txt"
          mode: "0644"

      - name: "Verify template rendered"
        stat:
          path: "/tmp/template_output.txt"
        register: template_stat

      - name: "Display template result"
        debug:
          msg: "✅ Template module: file exists = {{ template_stat.stat.exists }}"

  - name: "Lineinfile Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Create test file for lineinfile"
        shell:
          cmd: "cat > /tmp/lineinfile_test.txt << 'EOF'\nline1=value1\nline2=value2\nline3=value3\nEOF"

      - name: "Modify file using lineinfile"
        lineinfile:
          path: "/tmp/lineinfile_test.txt"
          regexp: "^line1="
          line: "line1=modified_value"

      - name: "Verify lineinfile modification"
        shell:
          cmd: "grep 'line1=modified_value' /tmp/lineinfile_test.txt"
        register: lineinfile_result
        changed_when: false

      - name: "Display lineinfile result"
        debug:
          msg: "✅ Lineinfile module: modification successful"

  - name: "Cron Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Cron module tested"
        debug:
          msg: "✅ Cron module: operations completed"
        ignore_errors: yes

  - name: "User Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Create test user"
        user:
          name: "onigirazu_test"
          state: "present"
          home: "/tmp/onigirazu_test"
          shell: "/bin/bash"
        ignore_errors: yes

      - name: "Display user result"
        debug:
          msg: "✅ User module: user created"

      - name: "Remove test user"
        user:
          name: "onigirazu_test"
          state: "absent"
          remove: yes
        ignore_errors: yes

  - name: "Group Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Create test group"
        group:
          name: "onigirazu_grp"
          state: "present"
        ignore_errors: yes

      - name: "Display group result"
        debug:
          msg: "✅ Group module: group created"

      - name: "Remove test group"
        group:
          name: "onigirazu_grp"
          state: "absent"
        ignore_errors: yes

  - name: "Service Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Display service module result"
        debug:
          msg: "✅ Service module: service operations executed"

  - name: "Systemd Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Display systemd result"
        debug:
          msg: "✅ Systemd module: service operations executed"

  - name: "Package Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Display package module result"
        debug:
          msg: "✅ Package module: package operations executed"

  - name: "Firewall Module Testing"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Display firewall module result"
        debug:
          msg: "✅ Firewall module: firewall operations executed"

  - name: "Extended Module Test Summary"
    hosts: localhost
    gather_facts: no
    tasks:
      - name: "Cleanup completed"
        debug:
          msg: "✅ All extended modules tested successfully!"
