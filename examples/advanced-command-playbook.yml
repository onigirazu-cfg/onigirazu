name: "Advanced command execution examples"

plays:
  - name: "System administration tasks"
    hosts: "localhost"
    
    tasks:
      - name: "Check if user exists"
        module: "command"
        args:
          command: "id"
          shell: false
      
      - name: "Get system load average"
        module: "shell"
        args:
          command: "uptime"
      
      - name: "Check memory usage"
        module: "shell"
        args:
          command: "free -h"
      
      - name: "List running processes"
        module: "shell"
        args:
          command: "ps aux | head -10"
      
      - name: "Check network interfaces"
        module: "shell"
        args:
          command: "ifconfig | grep -E '^[a-z]|inet '"
      
      - name: "Create backup directory"
        module: "shell"
        args:
          command: "mkdir -p /tmp/backup-$(date +%Y%m%d)"
      
      - name: "Show backup directory contents"
        module: "shell"
        args:
          command: "ls -la /tmp/backup-*"
