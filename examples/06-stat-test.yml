---
plays:
  - name: Test stat module
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Check if /etc/hosts exists
        stat:
          path: /etc/hosts
        register: hosts_file

      - name: Debug hosts file stat
        debug:
          msg: |
            File: {{ hosts_file.path }}
            Exists: {{ hosts_file.exists }}
            Is regular file: {{ hosts_file.isreg }}
            Size: {{ hosts_file.size }} bytes
            Mode: {{ hosts_file.mode }}

      - name: Check if /tmp directory exists
        stat:
          path: /tmp
        register: tmp_dir

      - name: Debug tmp directory stat
        debug:
          msg: |
            Path: {{ tmp_dir.path }}
            Exists: {{ tmp_dir.exists }}
            Is directory: {{ tmp_dir.isdir }}
            Readable: {{ tmp_dir.readable }}
            Writable: {{ tmp_dir.writable }}

      - name: Check non-existent file
        stat:
          path: /this/does/not/exist
        register: nonexistent

      - name: Debug non-existent file
        debug:
          msg: "File exists: {{ nonexistent.exists }}"

      - name: Create a test file
        shell:
          cmd: echo "Test content" > /tmp/onigirazu-test.txt

      - name: Stat the created file
        stat:
          path: /tmp/onigirazu-test.txt
        register: test_file

      - name: Debug test file
        debug:
          msg: |
            Created file exists: {{ test_file.exists }}
            Is regular file: {{ test_file.isreg }}
            Size: {{ test_file.size }} bytes

      - name: Clean up test file
        shell:
          cmd: rm -f /tmp/onigirazu-test.txt
