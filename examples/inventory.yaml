# Onigirazu Inventory Example
# This file defines the hosts and groups for your infrastructure

groups:
  # Web servers group
  webservers:
    hosts:
      web1:
        address: "192.168.1.10"
        port: 22
        user: "ubuntu"
        vars:
          http_port: 80
          https_port: 443
          server_role: "frontend"

      web2:
        address: "192.168.1.11"
        port: 22
        user: "ubuntu"
        vars:
          http_port: 80
          https_port: 443
          server_role: "frontend"

    vars:
      # Group-level variables
      nginx_version: "1.20"
      ssl_enabled: true
      backup_enabled: true

    children: []  # No child groups

  # Database servers group
  databases:
    hosts:
      db1:
        address: "192.168.1.20"
        port: 22
        user: "ubuntu"
        vars:
          mysql_port: 3306
          server_role: "database"
          backup_schedule: "daily"

      db2:
        address: "192.168.1.21"
        port: 22
        user: "ubuntu"
        vars:
          mysql_port: 3306
          server_role: "database"
          backup_schedule: "daily"

    vars:
      mysql_version: "8.0"
      replication_enabled: true
      backup_retention: "30d"

    children: []

  # Load balancers group
  loadbalancers:
    hosts:
      lb1:
        address: "192.168.1.5"
        port: 22
        user: "ubuntu"
        vars:
          server_role: "loadbalancer"
          haproxy_stats_port: 8404

    vars:
      haproxy_version: "2.4"
      ssl_termination: true

    children: []

  # Development environment
  development:
    hosts:
      dev1:
        address: "192.168.1.100"
        port: 22
        user: "developer"
        vars:
          environment: "development"
          debug_enabled: true

    vars:
      environment_type: "dev"
      monitoring_enabled: false

    children: []

  # Production environment (includes web servers and databases)
  production:
    hosts: {}  # No direct hosts, only children

    vars:
      environment_type: "prod"
      monitoring_enabled: true
      backup_enabled: true
      ssl_required: true

    children:
      - "webservers"
      - "databases"
      - "loadbalancers"

  # All servers group (meta group)
  all_servers:
    hosts: {}  # No direct hosts

    vars:
      # Global variables for all servers
      timezone: "UTC"
      ntp_servers:
        - "pool.ntp.org"
        - "time.google.com"
      log_retention: "7d"
      security_updates: true

    children:
      - "production"
      - "development"
