name: "macOS user and group management examples"

plays:
  - name: "Create system users and groups on macOS"
    hosts: "localhost"
    become: true
    
    tasks:
      - name: "Check current user"
        module: "command"
        args:
          command: "whoami"
          shell: false
      
      - name: "List current groups"
        module: "command"
        args:
          command: "groups"
          shell: false
      
      - name: "Check if test group exists"
        module: "command"
        args:
          command: "dscl . -read /Groups/test 2>/dev/null || echo 'Group does not exist'"
          shell: true
      
      - name: "Create test group if it doesn't exist"
        module: "shell"
        args:
          command: "dscl . -create /Groups/test gid 9999 || echo 'Group already exists'"
      
      - name: "Verify test group was created"
        module: "command"
        args:
          command: "dscl . -read /Groups/test"
          shell: true
      
      - name: "Check system information"
        module: "command"
        args:
          command: "uname -a"
          shell: false
      
      - name: "List all groups"
        module: "command"
        args:
          command: "dscl . -list /Groups"
          shell: true
