---
# Firewall Management Examples
# This playbook demonstrates firewall module capabilities
# Supports UFW, firewalld, and iptables with automatic detection

- name: Firewall Management Demo
  hosts: all
  tasks:
    # Enable/Disable Firewall
    - name: Enable firewall
      firewall:
        operation: enable

    - name: Disable firewall (use with caution!)
      firewall:
        operation: disable
      when: false  # Disabled by default for safety

    # Port Rules
    - name: Allow SSH port
      firewall:
        operation: rule
        port: "22"
        protocol: tcp
        action: allow

    - name: Allow HTTP port
      firewall:
        operation: rule
        port: "80"
        protocol: tcp
        action: allow

    - name: Allow HTTPS port
      firewall:
        operation: rule
        port: "443"
        protocol: tcp
        action: allow

    - name: Allow custom application port
      firewall:
        operation: rule
        port: "8080"
        protocol: tcp
        action: allow

    - name: Allow UDP port for DNS
      firewall:
        operation: rule
        port: "53"
        protocol: udp
        action: allow

    - name: Deny specific port
      firewall:
        operation: rule
        port: "23"
        protocol: tcp
        action: deny

    - name: Remove port rule
      firewall:
        operation: rule
        port: "8080"
        protocol: tcp
        state: absent

    # Service Rules (UFW and firewalld)
    - name: Allow SSH service
      firewall:
        operation: service
        service: ssh
        action: allow

    - name: Allow HTTP service
      firewall:
        operation: service
        service: http
        action: allow

    - name: Allow HTTPS service
      firewall:
        operation: service
        service: https
        action: allow

    - name: Allow MySQL service
      firewall:
        operation: service
        service: mysql
        action: allow

    - name: Deny FTP service
      firewall:
        operation: service
        service: ftp
        action: deny

    - name: Remove service rule
      firewall:
        operation: service
        service: mysql
        state: absent

    # Source-based Rules
    - name: Allow from specific IP
      firewall:
        operation: source
        source: "192.168.1.100"
        action: allow

    - name: Allow from subnet
      firewall:
        operation: source
        source: "10.0.0.0/8"
        action: allow

    - name: Allow from office network
      firewall:
        operation: source
        source: "172.16.0.0/16"
        action: allow

    - name: Deny from specific IP
      firewall:
        operation: source
        source: "203.0.113.0"
        action: deny

    - name: Remove source rule
      firewall:
        operation: source
        source: "192.168.1.100"
        state: absent

    # Complex Rules Examples
    - name: Allow PostgreSQL from specific subnet
      firewall:
        operation: rule
        port: "5432"
        protocol: tcp
        action: allow

    - name: Allow Redis from localhost only
      firewall:
        operation: source
        source: "127.0.0.1"
        action: allow

    - name: Allow MongoDB port
      firewall:
        operation: rule
        port: "27017"
        protocol: tcp
        action: allow

    # List Rules
    - name: List all firewall rules
      firewall:
        operation: list
      register: firewall_rules

    - name: Display firewall rules
      debug:
        var: firewall_rules

    # Reload Firewall
    - name: Reload firewall configuration
      firewall:
        operation: reload

    # Complete Web Server Setup Example
    - name: Configure firewall for web server
      block:
        - name: Enable firewall
          firewall:
            operation: enable

        - name: Allow SSH
          firewall:
            operation: rule
            port: "22"
            protocol: tcp
            action: allow

        - name: Allow HTTP
          firewall:
            operation: rule
            port: "80"
            protocol: tcp
            action: allow

        - name: Allow HTTPS
          firewall:
            operation: rule
            port: "443"
            protocol: tcp
            action: allow

        - name: Reload firewall
          firewall:
            operation: reload

    # Complete Database Server Setup Example
    - name: Configure firewall for database server
      block:
        - name: Enable firewall
          firewall:
            operation: enable

        - name: Allow SSH
          firewall:
            operation: rule
            port: "22"
            protocol: tcp
            action: allow

        - name: Allow PostgreSQL from app servers
          firewall:
            operation: source
            source: "10.0.1.0/24"
            action: allow

        - name: Deny all other PostgreSQL connections
          firewall:
            operation: rule
            port: "5432"
            protocol: tcp
            action: deny

        - name: Reload firewall
          firewall:
            operation: reload
