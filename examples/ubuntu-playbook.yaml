# Ubuntu Playbook Example
# This playbook demonstrates Onigirazu features on Ubuntu

name: "Ubuntu System Setup"

vars:
  app_name: "myapp"
  app_version: "1.0.0"
  deploy_user: "ubuntu"
  config_dir: "/etc/{{ app_name }}"

plays:
  # Play 1: Ubuntu System Setup
  - name: "Ubuntu System Setup and Configuration"
    hosts: "localhost"

    gather_facts: false
    serial: false  # Run in parallel
    ignore_errors: false

    vars:
      packages_to_install:
        - "curl"
        - "wget"
        - "git"
        - "htop"
        - "vim"
        - "tree"
        - "unzip"

    pre_tasks:
      - name: "Update package cache"
        module: "package"
        args:
          name: "*"
          state: "latest"
          update_cache: true
        tags:
          - "system"
          - "updates"

      - name: "Install essential packages"
        module: "package"
        args:
          name: "{{ item }}"
          state: "present"
        loop:
          items:
            - "curl"
            - "wget"
            - "git"
            - "htop"
            - "vim"
            - "tree"
            - "unzip"
        tags:
          - "system"
          - "packages"

    tasks:
      - name: "Create application directory"
        module: "file"
        args:
          path: "/opt/{{ app_name }}"
          state: "directory"
          owner: "{{ deploy_user }}"
          group: "{{ deploy_user }}"
          mode: "0755"
        tags:
          - "app"
          - "directories"

      - name: "Create configuration directory"
        module: "file"
        args:
          path: "{{ config_dir }}"
          state: "directory"
          owner: "root"
          group: "root"
          mode: "0755"
        tags:
          - "app"
          - "config"

      - name: "Create application user"
        module: "user"
        args:
          name: "{{ deploy_user }}"
          state: "present"
          home: "/home/{{ deploy_user }}"
          shell: "/bin/bash"
          comment: "Application deployment user"
        tags:
          - "users"
          - "app"

      - name: "Create application group"
        module: "group"
        args:
          name: "{{ deploy_user }}"
          state: "present"
        tags:
          - "groups"
          - "app"

      - name: "Install Nginx"
        module: "package"
        args:
          name: "nginx"
          state: "present"
        tags:
          - "web"
          - "packages"

      - name: "Start Nginx service"
        module: "service"
        args:
          name: "nginx"
          state: "started"
          enabled: true
        tags:
          - "web"
          - "services"

      - name: "Create Nginx configuration"
        module: "file"
        args:
          path: "/etc/nginx/sites-available/{{ app_name }}"
          state: "present"
          owner: "root"
          group: "root"
          mode: "0644"
        tags:
          - "web"
          - "config"

      - name: "Enable Nginx site"
        module: "command"
        args:
          command: "ln -sf /etc/nginx/sites-available/{{ app_name }} /etc/nginx/sites-enabled/"
          shell: true
        tags:
          - "web"
          - "config"

      - name: "Test Nginx configuration"
        module: "command"
        args:
          command: "nginx -t"
          shell: true
        tags:
          - "web"
          - "validation"

      - name: "Reload Nginx"
        module: "service"
        args:
          name: "nginx"
          state: "reloaded"
        tags:
          - "web"
          - "services"

    post_tasks:
      - name: "Verify Nginx is running"
        module: "command"
        args:
          command: "systemctl is-active nginx"
          shell: true
        tags:
          - "web"
          - "verification"

      - name: "Check Nginx status"
        module: "command"
        args:
          command: "curl -I http://localhost"
          shell: true
        tags:
          - "web"
          - "verification"

  # Play 2: Application Deployment
  - name: "Application Deployment"
    hosts: "localhost"

    vars:
      app_repo: "https://github.com/example/{{ app_name }}.git"
      app_branch: "main"

    tasks:
      - name: "Clone application repository"
        module: "git"
        args:
          repo: "{{ app_repo }}"
          dest: "/opt/{{ app_name }}"
          version: "{{ app_branch }}"
          force: true
        tags:
          - "app"
          - "deployment"

      - name: "Set application permissions"
        module: "file"
        args:
          path: "/opt/{{ app_name }}"
          state: "directory"
          owner: "{{ deploy_user }}"
          group: "{{ deploy_user }}"
          mode: "0755"
        tags:
          - "app"
          - "permissions"

      - name: "Create application log directory"
        module: "file"
        args:
          path: "/var/log/{{ app_name }}"
          state: "directory"
          owner: "{{ deploy_user }}"
          group: "{{ deploy_user }}"
          mode: "0755"
        tags:
          - "app"
          - "logging"

  # Play 3: System Monitoring
  - name: "System Monitoring Setup"
    hosts: "localhost"

    tasks:
      - name: "Install monitoring tools"
        module: "package"
        args:
          name: "{{ item }}"
          state: "present"
        loop:
          items:
            - "htop"
            - "iotop"
            - "nethogs"
            - "sysstat"
        tags:
          - "monitoring"
          - "packages"

      - name: "Create monitoring script"
        module: "file"
        args:
          path: "/usr/local/bin/system-check.sh"
          state: "present"
          owner: "root"
          group: "root"
          mode: "0755"
        tags:
          - "monitoring"
          - "scripts"

      - name: "Make monitoring script executable"
        module: "command"
        args:
          command: "chmod +x /usr/local/bin/system-check.sh"
          shell: true
        tags:
          - "monitoring"
          - "scripts"
