---
# Remote server inventory configuration
# Example for cs.rastiegaiev.com with user usx

groups:
  remote_servers:
    hosts:
      cs_server:
        ansible_host: cs.rastiegaiev.com
        ansible_user: usx
        ansible_ssh_private_key_file: /Users/denys.rastiegaiev/.ssh/id_rsa
        ansible_ssh_port: 22
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
        # ansible_become: true  # uncomment if sudo is needed
        # ansible_become_user: root  # uncomment if sudo is needed

  all:
    hosts:
      cs_server:
        ansible_host: cs.rastiegaiev.com
        ansible_user: usx
        ansible_ssh_private_key_file: /Users/denys.rastiegaiev/.ssh/id_rsa
        ansible_ssh_port: 22
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Alternative configuration with password authentication
# (not recommended for production)
