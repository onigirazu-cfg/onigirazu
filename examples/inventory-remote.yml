---
# Remote server inventory configuration
# Example for cs.rastiegaiev.com with user usx

groups:
  remote_servers:
    hosts:
      cs_server:
        onigirazu_host: cs.rastiegaiev.com
        onigirazu_user: usx
        onigirazu_ssh_private_key_file: /Users/denys.rastiegaiev/.ssh/id_rsa
        onigirazu_ssh_port: 22
        onigirazu_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
        # onigirazu_become: true  # uncomment if sudo is needed
        # onigirazu_become_user: root  # uncomment if sudo is needed

  all:
    hosts:
      cs_server:
        onigirazu_host: cs.rastiegaiev.com
        onigirazu_user: usx
        onigirazu_ssh_private_key_file: /Users/denys.rastiegaiev/.ssh/id_rsa
        onigirazu_ssh_port: 22
        onigirazu_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Alternative configuration with password authentication
# (not recommended for production)
# groups:
#   remote_servers:
