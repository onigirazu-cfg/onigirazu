name: "User and group management examples"

plays:
  - name: "Create system users and groups"
    hosts: "localhost"
    become: true
    
    tasks:
      - name: "Create web group"
        module: "group"
        args:
          name: "web"
          state: "present"
          system: false
      
      - name: "Create database group"
        module: "group"
        args:
          name: "database"
          state: "present"
          system: false
      
      - name: "Create web user"
        module: "user"
        args:
          name: "webuser"
          state: "present"
          home: "/home/webuser"
          shell: "/bin/bash"
          groups: "web"
          comment: "Web application user"
      
      - name: "Create database user"
        module: "user"
        args:
          name: "dbuser"
          state: "present"
          home: "/home/dbuser"
          shell: "/bin/bash"
          groups: "database"
          comment: "Database user"
      
      - name: "Create system user for monitoring"
        module: "user"
        args:
          name: "monitor"
          state: "present"
          home: "/var/lib/monitor"
          shell: "/bin/false"
          system: true
          comment: "System monitoring user"
      
      - name: "Create system group for monitoring"
        module: "group"
        args:
          name: "monitoring"
          state: "present"
          system: true
      
      - name: "Add monitor user to monitoring group"
        module: "user"
        args:
          name: "monitor"
          state: "present"
          groups: "monitoring"
      
      - name: "Verify users exist"
        module: "command"
        args:
          command: "id webuser dbuser monitor"
          shell: true
      
      - name: "Verify groups exist"
        module: "command"
        args:
          command: "getent group web database monitoring"
          shell: true
