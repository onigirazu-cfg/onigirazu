---
# Command Execution Examples
# Demonstrates command and shell execution

plays:
  - name: "Command Execution Demo"
    hosts: all
    vars:
      work_dir: "/tmp/onigirazu-demo"

    tasks:
      # Simple command execution
      - name: "Check system uptime"
        command:
          cmd: "uptime"
        register: uptime_result

      # Command with arguments
      - name: "List directory contents"
        command:
          cmd: "ls"
          args: ["-la", "/tmp"]
        register: ls_result

      # Shell command with pipes
      - name: "Count running processes"
        shell:
          cmd: "ps aux | wc -l"
        register: process_count

      # Command with working directory
      - name: "Create and enter directory"
        command:
          cmd: "pwd"
          chdir: "{{ work_dir }}"
          creates: "{{ work_dir }}"
      # Command with environment variables
      - name: "Run command with custom environment"
        command:
          cmd: "env"
          environment:
            CUSTOM_VAR: "hello_world"
            PATH: "{{ onigirazu_env.PATH }}"
      # Conditional command execution
      - name: "Install Homebrew on macOS"
        shell:
          cmd: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
        when: "onigirazu_os_family == 'Darwin' and not homebrew_installed"

      # Command with timeout
      - name: "Run command with timeout"
        command:
          cmd: "sleep"
          args: ["2"]
          timeout: 5
      # Check command result
      - name: "Verify command success"
        command:
          cmd: "echo"
          args: ["Command executed successfully"]
        when: "uptime_result.rc == 0"

      # Download file using curl
      - name: "Download file"
        command:
          cmd: "curl"
          args: ["-o", "/tmp/test.txt", "https://httpbin.org/get"]
          creates: "/tmp/test.txt"
      # Complex shell operation
      - name: "System information gathering"
        shell:
          cmd: |
            echo "=== System Information ==="
            echo "Hostname: $(hostname)"
            echo "OS: $(uname -s)"
            echo "Kernel: $(uname -r)"
            echo "Architecture: $(uname -m)"
            echo "CPU Count: $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 'unknown')"
        register: system_info
