---
# Complete Server Setup Example
# Demonstrates a full server configuration workflow

plays:
  - name: "Complete Server Setup"
    hosts: all
    vars:
      app_user: "webapp"
      app_group: "webapp"
      app_dir: "/opt/webapp"
      config_dir: "/etc/webapp"
      log_dir: "/var/log/webapp"

    tasks:
      # System preparation
      - name: "Update package cache"
        module:
          type: "enhanced_package"
          update_cache: true

      - name: "Install essential packages"
        module:
          type: "package"
          name: ["curl", "wget", "git", "htop", "vim", "unzip"]
          state: "present"

      # Security setup
      - name: "Install security tools"
        module:
          type: "package"
          name: ["fail2ban", "ufw"]
          state: "present"
        when: "ansible_os_family != 'Darwin'"

      # User and group management
      - name: "Create application group"
        module:
          type: "group"
          name: "{{ app_group }}"
          state: "present"

      - name: "Create application user"
        module:
          type: "user"
          name: "{{ app_user }}"
          group: "{{ app_group }}"
          home: "{{ app_dir }}"
          shell: "/bin/bash"
          system: true
          create_home: false

      # Directory structure
      - name: "Create application directory"
        module:
          type: "file"
          path: "{{ app_dir }}"
          state: "directory"
          owner: "{{ app_user }}"
          group: "{{ app_group }}"
          mode: "0755"

      - name: "Create configuration directory"
        module:
          type: "file"
          path: "{{ config_dir }}"
          state: "directory"
          owner: "root"
          group: "{{ app_group }}"
          mode: "0750"

      - name: "Create log directory"
        module:
          type: "file"
          path: "{{ log_dir }}"
          state: "directory"
          owner: "{{ app_user }}"
          group: "{{ app_group }}"
          mode: "0755"

      # Application deployment
      - name: "Clone application repository"
        module:
          type: "git"
          repo: "https://github.com/example/webapp.git"
          dest: "{{ app_dir }}/src"
          clone: true
        ignore_errors: true

      # Configuration files
      - name: "Create application configuration"
        module:
          type: "file"
          path: "{{ config_dir }}/app.conf"
          content: |
            # Application Configuration
            app_name=webapp
            app_version=1.0.0
            log_level=info
            log_file={{ log_dir }}/app.log
            bind_address=0.0.0.0
            bind_port=8080
          owner: "root"
          group: "{{ app_group }}"
          mode: "0640"

      # Service configuration
      - name: "Create systemd service file"
        module:
          type: "file"
          path: "/etc/systemd/system/webapp.service"
          content: |
            [Unit]
            Description=Web Application
            After=network.target

            [Service]
            Type=simple
            User={{ app_user }}
            Group={{ app_group }}
            WorkingDirectory={{ app_dir }}
            ExecStart={{ app_dir }}/bin/webapp
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
          mode: "0644"
        when: "ansible_os_family != 'Darwin'"

      # Log rotation
      - name: "Configure log rotation"
        module:
          type: "file"
          path: "/etc/logrotate.d/webapp"
          content: |
            {{ log_dir }}/*.log {
                daily
                missingok
                rotate 30
                compress
                delaycompress
                notifempty
                create 0644 {{ app_user }} {{ app_group }}
                postrotate
                    systemctl reload webapp || true
                endscript
            }
          mode: "0644"
        when: "ansible_os_family != 'Darwin'"

      # Firewall configuration
      - name: "Configure firewall"
        module:
          type: "command"
          cmd: "ufw"
          args: ["allow", "8080/tcp"]
        when: "ansible_os_family != 'Darwin'"
        ignore_errors: true

      # Service management
      - name: "Reload systemd daemon"
        module:
          type: "command"
          cmd: "systemctl"
          args: ["daemon-reload"]
        when: "ansible_os_family != 'Darwin'"

      - name: "Enable and start webapp service"
        module:
          type: "service"
          name: "webapp"
          state: "started"
          enabled: true
        when: "ansible_os_family != 'Darwin'"
        ignore_errors: true

      # Health check
      - name: "Wait for application to start"
        module:
          type: "command"
          cmd: "sleep"
          args: ["5"]

      - name: "Check application health"
        module:
          type: "command"
          cmd: "curl"
          args: ["-f", "http://localhost:8080/health"]
        ignore_errors: true
