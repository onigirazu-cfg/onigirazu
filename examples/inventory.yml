hosts:
  - name: localhost
    address: 127.0.0.1
    user: root
    vars:
      connection: local

  - name: web-server
    address: 192.168.1.10
    user: ubuntu
    key_file: ~/.ssh/id_rsa
    vars:
      server_role: web

  - name: db-server
    address: 192.168.1.11
    user: ubuntu
    key_file: ~/.ssh/id_rsa
    vars:
      server_role: database

groups:
  web_servers:
    name: web_servers
    hosts:
      web-server:
        name: web-server
        address: 192.168.1.10
        user: ubuntu
        key_file: ~/.ssh/id_rsa

  db_servers:
    name: db_servers
    hosts:
      db-server:
        name: db-server
        address: 192.168.1.11
        user: ubuntu
        key_file: ~/.ssh/id_rsa

  all_servers:
    name: all_servers
    hosts:
      web-server:
        name: web-server
        address: 192.168.1.10
        user: ubuntu
        key_file: ~/.ssh/id_rsa
      db-server:
        name: db-server
        address: 192.168.1.11
        user: ubuntu
        key_file: ~/.ssh/id_rsa
