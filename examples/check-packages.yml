---
# Check Package Status
# Verify which packages are actually installed

plays:
  - name: "Check Package Status"
    hosts: all
    tasks:
      # Check if packages are installed using command module
      - name: "Check if git is installed"
        command:
          command: "which git"
      - name: "Check if curl is installed"
        command:
          command: "which curl"
      - name: "Check if wget is installed"
        command:
          command: "which wget"
      - name: "Check if tree is installed"
        command:
          command: "which tree"
      - name: "Check if nano is installed"
        command:
          command: "which nano"
      - name: "Check if jq is installed"
        command:
          command: "which jq"
      - name: "Check if htop is installed"
        command:
          command: "which htop"
      - name: "Check if vim is installed"
        command:
          command: "which vim"
      # Also check package manager status
      - name: "List installed packages (apt)"
        command:
          command: "dpkg -l | grep -E '(tree|nano|jq|htop|vim)'"