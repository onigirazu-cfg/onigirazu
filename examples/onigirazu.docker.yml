# Onigirazu Docker Configuration (v1.55.1)
#
# Optimized for containerized deployments.
# JSON logging for container log aggregation (Docker logs, ECS, K8s, etc.)

# ============================================================================
# EXECUTION SETTINGS
# ============================================================================

# Docker: use available CPU cores
max_concurrency: 10

# Docker: standard timeout
default_timeout: 30s

# Docker: retry strategy
retry_attempts: 3
retry_delay: 5s

# ============================================================================
# LOGGING - CONTAINER OPTIMIZED
# ============================================================================

# Docker: info level for normal operation, debug for troubleshooting
log_level: info

# Docker: JSON format for container log aggregation
# Compatible with:
# - Docker logging drivers
# - Kubernetes log collectors
# - ECS CloudWatch
# - Splunk, Datadog, New Relic, etc.
log_format: json

# ============================================================================
# SECURITY
# ============================================================================

# Docker: controlled environment, can allow shell commands
allow_shell_commands: true

# Docker: standard blocklist
blocked_commands:
  - "rm -rf"
  - "format"
  - "mkfs"
  - "dd if="
  - ":(){ :|:& };:"
  - "shutdown"
  - "reboot"

# ============================================================================
# PERFORMANCE
# ============================================================================

enable_caching: true
cache_ttl: 5m
enable_checksum: true
enable_parallel: false
parallel_strategy: linear

# ============================================================================
# EXECUTION MODES
# ============================================================================

dry_run: false
check_mode: false
verbose: false
show_diff: true

# ============================================================================
# UI SETTINGS
# ============================================================================

# Docker: JSON output for log aggregation
output_format: json

# Docker: disable interactive mode (no TTY in containers)
interactive_mode: false

# Docker: no colors (unnecessary in containers, saves bytes)
color_output: false

# Docker: no progress bar (not useful in container logs)
progress_bar: false

# ============================================================================
# SSH/CONNECTION SETTINGS
# ============================================================================

# Docker: standard SSH settings
ssh_timeout: 30s
ssh_keepalive: 60s
ssh_max_sessions: 10
connection_reuse: true

# Docker: host key verification depends on network
# Strict is better but requires pre-configured known_hosts
ssh_strict_host_key: true
ssh_known_hosts_file: ~/.ssh/known_hosts
default_insecure_ignore_host_key: false

# ============================================================================
# MONITORING & METRICS
# ============================================================================

# Docker: metrics for container orchestration platforms
enable_metrics: false
metrics_port: 9090
metrics_path: /metrics

# Docker: profiling usually disabled (only for debugging)
enable_profiling: false

# ============================================================================
# VAULT INTEGRATION
# ============================================================================

# Docker: Vault support for secrets from container secrets
vault_enabled: false
vault_address: ""
vault_token: ""

# ============================================================================
# SYNTAX
# ============================================================================

preferred_module_syntax: nested
enforce_module_syntax: false
