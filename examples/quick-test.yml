---
# Quick Test Example
# Simple playbook for testing Onigirazu functionality

plays:
  - name: "Quick Test"
    hosts: localhost
    tasks:
      # Test package module
      - name: "Install tree package"
        package:
          name: "tree"
          state: "present"
      # Test file module
      - name: "Create test directory"
        file:
          path: "/tmp/onigirazu-test"
          state: "directory"
          mode: "0755"
      # Test command module
      - name: "Check system information"
        command:
          cmd: "uname"
          args: ["-a"]
        register: system_info

      # Test file creation
      - name: "Create test file"
        file:
          path: "/tmp/onigirazu-test/test.txt"
          state: "present"
          content: |
            Onigirazu Test File
            Created at: {{ onigirazu_date_time.iso8601 }}
            System: {{ system_info.stdout }}
          mode: "0644"
      # Test copy module
      - name: "Copy test file"
        copy:
          src: "/tmp/onigirazu-test/test.txt"
          dest: "/tmp/onigirazu-test/test-copy.txt"
          mode: "0644"
      # Test shell module
      - name: "List test directory"
        shell:
          cmd: "ls -la /tmp/onigirazu-test/"
        register: dir_listing

      # Cleanup
      - name: "Remove test directory"
        file:
          path: "/tmp/onigirazu-test"
          state: "absent"
