---
# System Information Check - Alternative approach

plays:
  - name: "System Information"
    hosts: all
    tasks:
      - name: "Check uname"
        command:
          command: "uname -a"
      - name: "Check if this is CentOS/RHEL"
        command:
          command: "cat /etc/redhat-release"
      - name: "List /etc files"
        command:
          command: "ls /etc/*release* /etc/*version*"
      - name: "Test tree command directly"
        command:
          command: "tree /tmp"
      - name: "Test nano command directly"
        command:
          command: "echo 'test' | nano --version"