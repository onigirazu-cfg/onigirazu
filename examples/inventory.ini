# Ansible-style INI inventory file
# This format is compatible with Ansible inventory files

# Ungrouped hosts (optional)
# localhost ansible_connection=local

# Web servers group
[webservers]
web1 ansible_host=192.168.1.10 ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/id_rsa app_port=8080
web2 ansible_host=192.168.1.11 ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/id_rsa app_port=8080

# Database servers group
[databases]
db1 ansible_host=192.168.1.20 ansible_user=postgres db_port=5432 db_name=myapp
db2 ansible_host=192.168.1.21 ansible_user=postgres db_port=5432 db_name=myapp

# Cache servers group
[cache]
cache1 ansible_host=192.168.1.30 ansible_user=redis redis_port=6379

# Load balancers group
[loadbalancers]
lb1 ansible_host=192.168.1.5 ansible_user=haproxy

# Group variables for webservers
[webservers:vars]
http_port=80
https_port=443
max_connections=1000

# Group variables for databases
[databases:vars]
backup_enabled=true
backup_schedule=0 2 * * *

# Group variables for cache
[cache:vars]
max_memory=2gb

# Nested group: production includes multiple groups
[production:children]
webservers
databases
cache
loadbalancers

# Variables for production group
[production:vars]
env=production
monitoring_enabled=true

# Another nested group example: frontend
[frontend:children]
webservers
loadbalancers

[frontend:vars]
ssl_enabled=true

# Backend group
[backend:children]
databases
cache

[backend:vars]
internal_network=true

# Top-level group containing everything
[all:children]
production
