---
# Force Package Operations Test
# Test package installation and removal more explicitly

plays:
  - name: "Force Package Test"
    hosts: all
    tasks:
      # First, let's see what we're working with
      - name: "Check current tree status"
        module:
          type: "command"
          command: "tree --version || echo 'tree not found'"

      - name: "Check current nano status"
        module:
          type: "command"
          command: "nano --version || echo 'nano not found'"

      # Try to remove nano explicitly
      - name: "Force remove nano package"
        module:
          type: "package"
          name: "nano"
          state: "absent"

      # Try to install tree explicitly
      - name: "Force install tree package"
        module:
          type: "package"
          name: "tree"
          state: "present"

      # Check status after operations
      - name: "Check tree status after install"
        module:
          type: "command"
          command: "tree --version || echo 'tree still not found'"

      - name: "Check nano status after removal"
        module:
          type: "command"
          command: "nano --version || echo 'nano successfully removed'"

      # Test tree functionality
      - name: "Test tree command on /tmp"
        module:
          type: "command"
          command: "tree /tmp -L 1"
