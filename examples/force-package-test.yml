---
# Force Package Operations Test
# Test package installation and removal more explicitly

plays:
  - name: "Force Package Test"
    hosts: all
    tasks:
      # First, let's see what we're working with
      - name: "Check if tree binary exists"
        stat:
          path: "/usr/bin/tree"
        register: tree_check

      - name: "Check if nano binary exists"
        stat:
          path: "/usr/bin/nano"
        register: nano_check

      # Try to remove nano explicitly
      - name: "Force remove nano package"
        package:
          name: "nano"
          state: "absent"

      # Try to install tree explicitly
      - name: "Force install tree package"
        package:
          name: "tree"
          state: "present"

      # Check status after operations
      - name: "Verify tree installed"
        stat:
          path: "/usr/bin/tree"
        register: tree_after

      - name: "Verify nano removed"
        stat:
          path: "/usr/bin/nano"
        register: nano_after

      # Display results
      - name: "Show package status"
        debug:
          msg: |
            Tree binary exists: {{ tree_after.stat.exists }}
            Nano binary exists: {{ nano_after.stat.exists }}
