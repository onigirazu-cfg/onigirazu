# Onigirazu configuration: /etc/onigirazu/onigirazu.yml, onigirazu.yml next to the
# playbook, or -c FILE. Every setting is commented out: the built-in default applies.
# Reference: https://github.com/onigirazu-cfg/onigirazu/blob/main/docs/CONFIGURATION_REFERENCE.md

# Hosts worked on in parallel (apply -f)
# max_concurrency: 10

# Stop the whole run after this long (apply --timeout); no limit by default
# default_timeout: 2h

# Logging: debug, info, warn, error; text or json
# log_level: info
# log_format: text

# Output: text, json or yaml (apply -o); unified diffs of changed files (apply --diff)
# output_format: text
# show_diff: false
# color_output: true

# SSH: time to connect to a host; host key checks
# ssh_timeout: 30s
# ssh_known_hosts_file: ~/.ssh/known_hosts
# ssh_strict_host_key: false     # true: reject hosts not in the known_hosts file
# remote_server: auto            # command server on hosts: auto (agent, Python, sh), python, sh

# Roles and collections, after roles/ next to the playbook
# roles_path: [/etc/ansible/roles]
# collections_path: [~/.ansible/collections]

# Managed state: next to the playbook (file) or shared in S3
# managed_state:
#   backend: s3
#   bucket: onigirazu-state
#   prefix: prod/
#   endpoint: s3.example.org
#   region: us-east-1

# Secret providers for templates (credentials come from the environment)
# secrets:
#   cache_ttl: 5m
#   vault:
#     address: https://vault.example.org:8200
#     mount: secret

# Prometheus metrics during apply
# enable_metrics: false
# metrics_listen_address: 127.0.0.1
# metrics_port: 9090
