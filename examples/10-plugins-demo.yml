---
# Example playbook demonstrating plugin system usage
# This playbook shows how to use:
# - Filter plugins for template rendering
# - Callback plugins for metrics collection
# - Module plugins for custom tasks

- name: Plugin System Demo
  hosts: localhost
  gather_facts: false

  vars:
    app_name: "MyApp"
    environment: "production"
    version: "1.2.3"
    users:
      - alice
      - bob
      - charlie
    config_data:
      database: "postgresql"
      cache: "redis"
      queue: "rabbitmq"

  tasks:
    # Test built-in filter plugins
    - name: Test upper filter
      debug:
        msg: "{{ app_name | upper }}"

    - name: Test lower filter
      debug:
        msg: "{{ environment | lower }}"

    - name: Test title filter
      debug:
        msg: "{{ 'hello world' | title }}"

    - name: Test join filter
      debug:
        msg: "Users: {{ users | join(', ') }}"

    - name: Test default filter
      debug:
        msg: "{{ undefined_var | default('default_value') }}"

    - name: Test length filter
      debug:
        msg: "Number of users: {{ users | length }}"

    # Test string manipulation
    - name: Test replace filter
      debug:
        msg: "{{ version | replace('.', '-') }}"

    - name: Test trim filter
      debug:
        msg: "{{ '  spaces  ' | trim }}"

    - name: Test split filter
      debug:
        msg: "{{ version | split('.') }}"

    # Complex template with multiple filters
    - name: Complex template example
      debug:
        msg: |
          Application: {{ app_name | upper }}
          Environment: {{ environment | title }}
          Version: {{ version }}
          Users ({{ users | length }}): {{ users | join(', ') | upper }}
          Database: {{ config_data.database | default('mysql') | upper }}

    # Example: Using custom module plugin (if enabled)
    # Uncomment when hello module plugin is compiled and enabled
    # - name: Test custom hello module
    #   hello:
    #     name: "World"
    #     greeting: "Hello"

    # Example: Set facts that will be tracked by callback plugins
    - name: Set application facts
      set_fact:
        app_info:
          name: "{{ app_name }}"
          env: "{{ environment }}"
          version: "{{ version }}"
          deployed_at: "{{ onigirazu_date_time.iso8601 | default('unknown') }}"

    - name: Display application info
      debug:
        msg: "{{ app_info }}"

    # Example: File operations that will be tracked by metrics plugin
    - name: Create test file
      copy:
        content: |
          Application: {{ app_name }}
          Environment: {{ environment }}
          Version: {{ version }}
          Users: {{ users | join(', ') }}
        dest: /tmp/onigirazu_plugin_test.txt
        mode: '0644'

    - name: Verify file exists
      stat:
        path: /tmp/onigirazu_plugin_test.txt
      register: test_file_stat

    - name: Display file info
      debug:
        msg: "File exists: {{ test_file_stat.stat.exists }}, Size: {{ test_file_stat.stat.size | default(0) }} bytes"

    # Final summary
    - name: Plugin demo completed
      debug:
        msg: |
          ✅ Plugin System Demo Completed!

          Tested Features:
          - Built-in filter plugins (upper, lower, title, join, etc.)
          - Template rendering with filters
          - Callback plugin hooks (if enabled)
          - Module plugin integration (if enabled)

          Check metrics output if callback plugin is enabled:
          /tmp/onigirazu_metrics.json
