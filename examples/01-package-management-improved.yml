plays:
  - hosts: all
    name: Package Management Demo - Improved
    tasks:
      - name: Install essential development tools
        package:
          name:
            - git
            - curl
            - wget
            - tree
            - jq
            - htop
            - vim
          state: present
      - name: Remove unnecessary packages
        package:
          name:
            - nano
          state: absent
