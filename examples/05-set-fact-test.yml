---
plays:
  - name: Test set_fact and register functionality
    hosts: localhost
    gather_facts: false
    tasks:
      # Test 1: Simple set_fact
      - name: Set a simple fact
        set_fact:
          my_variable: "Hello from set_fact!"
          another_var: 42

      - name: Debug simple fact
        debug:
          msg: "my_variable = {{ my_variable }}, another_var = {{ another_var }}"

      # Test 2: Generate dynamic value using set_fact
      - name: Generate dynamic value
        set_fact:
          shell_result:
            stdout: "Dynamic value from set_fact"

      - name: Debug registered variable
        debug:
          msg: "Generated output: {{ shell_result.stdout }}"

      # Test 3: Set fact based on previous variable
      - name: Set fact from previous variable
        set_fact:
          processed_output: "Processed: {{ shell_result.stdout }}"

      - name: Debug processed fact
        debug:
          msg: "{{ processed_output }}"

      # Test 4: Multiple facts at once
      - name: Set multiple facts
        set_fact:
          fact1: "First fact"
          fact2: "Second fact"
          fact3: 123
          fact4: true

      - name: Debug all facts
        debug:
          msg: |
            All facts:
            - fact1: {{ fact1 }}
            - fact2: {{ fact2 }}
            - fact3: {{ fact3 }}
            - fact4: {{ fact4 }}

      # Test 5: Use built-in date fact
      - name: Set date result from facts
        set_fact:
          date_result:
            stdout: "{{ ansible_date_time.date }}"

      - name: Debug date result
        debug:
          msg: "Today's date: {{ date_result.stdout }}"
