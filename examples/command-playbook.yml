name: "Command execution examples"

plays:
  - name: "Execute various commands"
    hosts: "localhost"
    
    tasks:
      - name: "Show current date"
        module: "command"
        args:
          command: "date"
          shell: false
      
      - name: "List files in current directory"
        module: "command"
        args:
          command: "ls -la"
          shell: true
      
      - name: "Show system information"
        module: "command"
        args:
          command: "uname -a"
          shell: true
      
      - name: "Check disk usage"
        module: "command"
        args:
          command: "df -h"
          shell: true
      
      - name: "Show environment variables"
        module: "shell"
        args:
          command: "echo $HOME"
      
      - name: "Create a file with content using shell"
        module: "shell"
        args:
          command: "echo 'Hello from Onigirazu!' > /tmp/onigirazu-greeting.txt"
