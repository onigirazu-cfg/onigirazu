project_name: onigirazu

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go test ./...

builds:
  - id: onigirazu
    main: ./cmd/onigirazu
    binary: onigirazu
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "6"
      - "7"
    ignore:
      # Windows: only amd64 and 386
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      # FreeBSD: only amd64 and 386
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
      # OpenBSD: only amd64 and 386
      - goos: openbsd
        goarch: arm
      - goos: openbsd
        goarch: arm64
      # NetBSD: only amd64 and 386
      - goos: netbsd
        goarch: arm
      - goos: netbsd
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/onigirazu-cfg/onigirazu/internal/version.Version={{.Version}}
      - -X github.com/onigirazu-cfg/onigirazu/internal/version.Commit={{.Commit}}
      - -X github.com/onigirazu-cfg/onigirazu/internal/version.Date={{.Date}}
      - -X github.com/onigirazu-cfg/onigirazu/internal/version.BuildUser={{.Env.USER}}
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: onigirazu
    builds:
      - onigirazu
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      - docs/**/*
      - examples/**/*
      - config.example.yml
      - inventory.example.yml
      - playbook.example.yml

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

# sboms:
#   - artifacts: archive
#   - id: source
#     artifacts: source

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^style:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'New Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Refactors'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: 'Documentation'
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: 'Other'
      order: 999

release:
  github:
    owner: onigirazu-cfg
    name: onigirazu
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Onigirazu {{ .Tag }}

    Welcome to this new release of Onigirazu - a modern configuration management tool!

    ### 🎯 What's New
    Check the changelog below for all changes in this release.

    ### 📦 Supported Platforms
    This release includes pre-built binaries for:
    - **Linux**: x86_64, ARM64, ARMv6, ARMv7, i386
    - **macOS**: x86_64 (Intel), ARM64 (Apple Silicon)
    - **Windows**: x86_64, i386
    - **FreeBSD**: x86_64, i386
    - **OpenBSD**: x86_64, i386
    - **NetBSD**: x86_64, i386

  footer: |
    ## 🐳 Docker Images

    Multi-architecture Docker images are available:
    ```bash
    # Docker Hub
    docker pull onigirazu/onigirazu:{{ .Tag }}

    # GitHub Container Registry
    docker pull ghcr.io/onigirazu-cfg/onigirazu:{{ .Tag }}
    ```

    Supported architectures: `linux/amd64`, `linux/arm64`

    ## 📥 Installation

    ### Using Go
    ```bash
    go install github.com/onigirazu-cfg/onigirazu/cmd/onigirazu@{{ .Tag }}
    ```

    ### Using Homebrew (macOS/Linux)
    ```bash
    brew install onigirazu-cfg/tap/onigirazu
    ```

    ### Using Package Managers

    #### Debian/Ubuntu (DEB)
    ```bash
    wget https://github.com/onigirazu-cfg/onigirazu/releases/download/{{ .Tag }}/onigirazu_{{ .Tag }}_linux_amd64.deb
    sudo dpkg -i onigirazu_{{ .Tag }}_linux_amd64.deb
    ```

    #### RHEL/CentOS/Fedora (RPM)
    ```bash
    wget https://github.com/onigirazu-cfg/onigirazu/releases/download/{{ .Tag }}/onigirazu_{{ .Tag }}_linux_amd64.rpm
    sudo rpm -i onigirazu_{{ .Tag }}_linux_amd64.rpm
    ```

    #### Arch Linux
    ```bash
    wget https://github.com/onigirazu-cfg/onigirazu/releases/download/{{ .Tag }}/onigirazu_{{ .Tag }}_linux_amd64.pkg.tar.zst
    sudo pacman -U onigirazu_{{ .Tag }}_linux_amd64.pkg.tar.zst
    ```

    #### Alpine Linux (APK)
    ```bash
    wget https://github.com/onigirazu-cfg/onigirazu/releases/download/{{ .Tag }}/onigirazu_{{ .Tag }}_linux_amd64.apk
    sudo apk add --allow-untrusted onigirazu_{{ .Tag }}_linux_amd64.apk
    ```

    ### Manual Installation
    1. Download the appropriate archive for your platform from the assets below
    2. Extract the binary: `tar -xzf onigirazu_*.tar.gz` (or `unzip` for Windows)
    3. Move to your PATH: `sudo mv onigirazu /usr/local/bin/` (Linux/macOS)
    4. Verify installation: `onigirazu --version`

    ### Quick Start
    ```bash
    # Check version
    onigirazu --version

    # Run a playbook
    onigirazu run playbook.yml -i inventory.yml

    # Get help
    onigirazu --help
    ```

    ## 📚 Documentation
    - [Installation Guide](https://github.com/onigirazu-cfg/onigirazu/blob/main/docs/installation.md)
    - [Getting Started](https://github.com/onigirazu-cfg/onigirazu/blob/main/docs/getting-started.md)
    - [Module Reference](https://github.com/onigirazu-cfg/onigirazu/blob/main/docs/modules.md)

    ## 🔐 Verification
    All binaries are checksummed. Verify your download:
    ```bash
    sha256sum -c checksums.txt
    ```

brews:
  - name: onigirazu
    repository:
      owner: onigirazu-cfg
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/onigirazu-cfg/onigirazu
    description: "Modern configuration management tool inspired by Ansible"
    license: MIT
    test: |
      system "#{bin}/onigirazu --version"
    dependencies:
      - name: go
        type: optional
    install: |-
      bin.install "onigirazu"

nfpms:
  - id: onigirazu
    package_name: onigirazu
    file_name_template: '{{ .ConventionalFileName }}'
    vendor: Onigirazu Team
    homepage: https://github.com/onigirazu-cfg/onigirazu
    maintainer: Onigirazu Team <team@onigirazu.dev>
    description: |-
      Modern configuration management tool inspired by Ansible.
      Onigirazu provides a simple, powerful way to manage system configurations
      with YAML playbooks and an extensive module system.
    license: MIT
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    dependencies:
      - git
    recommends:
      - ansible
    suggests:
      - docker
      - podman
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: ./README.md
        dst: /usr/share/doc/onigirazu/README.md
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/doc/onigirazu/LICENSE
        file_info:
          mode: 0644
      - src: docs/**/*
        dst: /usr/share/doc/onigirazu/docs
        file_info:
          mode: 0644
      - src: ./config.example.yml
        dst: /usr/share/onigirazu/config.example.yml
        file_info:
          mode: 0644
      - src: ./inventory.example.yml
        dst: /usr/share/onigirazu/inventory.example.yml
        file_info:
          mode: 0644
      - src: ./playbook.example.yml
        dst: /usr/share/onigirazu/playbook.example.yml
        file_info:
          mode: 0644
      - dst: /var/log/onigirazu
        type: dir
        file_info:
          mode: 0755
      - dst: /etc/onigirazu
        type: dir
        file_info:
          mode: 0755
    scripts:
      postinstall: "scripts/postinstall.sh"
      preremove: "scripts/preremove.sh"
    rpm:
      group: System Environment/Base
      compression: lzma
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

publishers:
  - name: fury.io
    ids:
      - onigirazu
    dir: "{{ dir .ArtifactPath }}"
    cmd: curl -F package=@{{ .ArtifactName }} https://{{ .Env.FURY_TOKEN }}@push.fury.io/onigirazu/

dockers:
  - image_templates:
      - "onigirazu/onigirazu:{{ .Tag }}-amd64"
      - "ghcr.io/onigirazu-cfg/onigirazu:{{ .Tag }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    extra_files:
      - go.mod
      - go.sum
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/amd64"
  - image_templates:
      - "onigirazu/onigirazu:{{ .Tag }}-arm64v8"
      - "ghcr.io/onigirazu-cfg/onigirazu:{{ .Tag }}-arm64v8"
    dockerfile: Dockerfile
    use: buildx
    extra_files:
      - go.mod
      - go.sum
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/arm64/v8"
    goarch: arm64

docker_manifests:
  - name_template: "onigirazu/onigirazu:{{ .Tag }}"
    image_templates:
      - "onigirazu/onigirazu:{{ .Tag }}-amd64"
      - "onigirazu/onigirazu:{{ .Tag }}-arm64v8"
  - name_template: "ghcr.io/onigirazu-cfg/onigirazu:{{ .Tag }}"
    image_templates:
      - "ghcr.io/onigirazu-cfg/onigirazu:{{ .Tag }}-amd64"
      - "ghcr.io/onigirazu-cfg/onigirazu:{{ .Tag }}-arm64v8"
  - name_template: "onigirazu/onigirazu:latest"
    image_templates:
      - "onigirazu/onigirazu:{{ .Tag }}-amd64"
      - "onigirazu/onigirazu:{{ .Tag }}-arm64v8"
  - name_template: "ghcr.io/onigirazu-cfg/onigirazu:latest"
    image_templates:
      - "ghcr.io/onigirazu-cfg/onigirazu:{{ .Tag }}-amd64"
      - "ghcr.io/onigirazu-cfg/onigirazu:{{ .Tag }}-arm64v8"
