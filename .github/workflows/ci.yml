name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

env:
  GO_VERSION: '1.24.9'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: false  # Temporarily disabled due to cache corruption

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: linux-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          linux-go-${{ matrix.go-version }}-
          linux-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...
      continue-on-error: true

    - name: Run tests with race detection
      run: go test -race -coverprofile=coverage.out -covermode=atomic -timeout=10m ./...

    - name: Run benchmarks
      run: go test -bench=. -benchmem ./... || true

    - name: Upload coverage to Codecov
      if: matrix.go-version == '1.24'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Temporarily disabled due to cache corruption

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        BINARY_NAME=onigirazu
        if [ "$GOOS" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi
        go build -ldflags="-s -w -X github.com/onigirazu-cfg/onigirazu/internal/version.Version=dev -X github.com/onigirazu-cfg/onigirazu/internal/version.Commit=${{ github.sha }} -X github.com/onigirazu-cfg/onigirazu/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o dist/${BINARY_NAME}-${GOOS}-${GOARCH} ./cmd/onigirazu

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/
        retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Temporarily disabled due to cache corruption

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.5.0
        args: --timeout=10m --verbose

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false  # Temporarily disabled due to cache corruption

    - name: Download build artifacts
      uses: actions/download-artifact@v6
      with:
        name: binaries-linux-amd64
        path: dist/

    - name: Make binary executable
      run: chmod +x dist/onigirazu-linux-amd64

    - name: Run integration tests
      run: |
        # Create test inventory and playbook
        mkdir -p test-integration
        cat > test-integration/inventory.yml << 'EOF'
        all:
          hosts:
            localhost:
              ansible_connection: local
        EOF

        cat > test-integration/playbook.yml << 'EOF'
        - name: Test playbook
          hosts: localhost
          tasks:
            - name: Test command module
              command:
                cmd: echo "Hello from integration test"
        EOF

        # Run the binary
        ./dist/onigirazu-linux-amd64 --version
        ./dist/onigirazu-linux-amd64 -playbook test-integration/playbook.yml -inventory test-integration/inventory.yml -check || true

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        tags: onigirazu:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, build, lint, integration-tests]
    if: always()

    steps:
    - name: Check all jobs status
      run: |
        if [[ "${{ needs.test.result }}" != "success" ||
              "${{ needs.build.result }}" != "success" ||
              "${{ needs.lint.result }}" != "success" ||
              ("${{ needs.integration-tests.result }}" != "success" && "${{ needs.integration-tests.result }}" != "skipped") ]]; then
          echo "Quality gate failed!"
          exit 1
        fi
        echo "Quality gate passed!"
