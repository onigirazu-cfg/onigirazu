name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

env:
  GO_VERSION: '1.26.6'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: go.sum

    - name: Cache Go build
      uses: actions/cache@v5
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-build-${{ matrix.go-version }}-
          ${{ runner.os }}-go-build-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...
      continue-on-error: true

    - name: Run tests with race detection
      run: go test -race -coverprofile=coverage.out -covermode=atomic -timeout=10m ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        BINARY_NAME=onigirazu
        if [ "$GOOS" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi
        go build -ldflags="-s -w -X github.com/onigirazu-cfg/onigirazu/internal/version.Version=dev -X github.com/onigirazu-cfg/onigirazu/internal/version.Commit=${{ github.sha }} -X github.com/onigirazu-cfg/onigirazu/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o dist/${BINARY_NAME}-${GOOS}-${GOARCH} ./cmd/onigirazu

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/
        retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        args: --timeout=10m --verbose

  integration-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: binaries-linux-amd64
        path: dist/

    - name: Smoke test against localhost
      run: |
        chmod +x dist/onigirazu-linux-amd64
        bin=$PWD/dist/onigirazu-linux-amd64
        work=$(mktemp -d) && cd "$work"
        cat > inventory.yml << 'EOF'
        groups:
          local:
            hosts:
              localhost:
                onigirazu_connection: local
        EOF
        cat > playbook.yml << 'EOF'
        plays:
          - name: smoke
            hosts: all
            vars:
              who: smoke
            tasks:
              - name: Directory
                file:
                  path: /tmp/onigirazu-smoke
                  state: directory
                  mode: "0750"
              - name: Template
                template:
                  content: "hello {{ who }}\n"
                  dest: /tmp/onigirazu-smoke/hello.txt
              - name: Line
                lineinfile:
                  path: /tmp/onigirazu-smoke/hello.txt
                  line: "second"
              - name: Command
                command:
                  command: "grep -q second /tmp/onigirazu-smoke/hello.txt"
        EOF
        "$bin" version
        "$bin" apply playbook.yml -i inventory.yml
        test "$(stat -c %a /tmp/onigirazu-smoke)" = 750
        test "$(head -1 /tmp/onigirazu-smoke/hello.txt)" = "hello smoke"
        grep -qx second /tmp/onigirazu-smoke/hello.txt
        # Second run must succeed too
        "$bin" apply playbook.yml -i inventory.yml

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        tags: onigirazu:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, build, lint, integration-tests]
    if: always()

    steps:
    - name: Check all jobs status
      run: |
        if [[ "${{ needs.test.result }}" != "success" ||
              "${{ needs.build.result }}" != "success" ||
              "${{ needs.lint.result }}" != "success" ||
              ("${{ needs.integration-tests.result }}" != "success" && "${{ needs.integration-tests.result }}" != "skipped") ]]; then
          echo "Quality gate failed!"
          exit 1
        fi
        echo "Quality gate passed!"
