name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install markdown-to-html
      run: npm install -g markdown-to-html

    - name: Convert README to HTML
      run: |
        mkdir -p docs
        markdown-to-html README.md > docs/readme.html

    - name: Create index page
      run: |
        cat > docs/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Onigirazu Documentation</title>
            <style>
                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                    max-width: 800px;
                    margin: 50px auto;
                    padding: 20px;
                    line-height: 1.6;
                }
                h1 { color: #333; }
                a { color: #0066cc; text-decoration: none; }
                a:hover { text-decoration: underline; }
                .links { margin-top: 30px; }
                .link-item { margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
            </style>
        </head>
        <body>
            <h1>Onigirazu Documentation</h1>
            <p>Welcome to the Onigirazu project documentation.</p>
            <div class="links">
                <div class="link-item">
                    <h3>📖 README</h3>
                    <p><a href="readme.html">View the project README</a></p>
                </div>
                <div class="link-item">
                    <h3>📚 API Documentation</h3>
                    <p><a href="https://pkg.go.dev/github.com/onigirazu-cfg/onigirazu" target="_blank">View on pkg.go.dev</a></p>
                </div>
                <div class="link-item">
                    <h3>💻 Source Code</h3>
                    <p><a href="https://github.com/onigirazu-cfg/onigirazu" target="_blank">View on GitHub</a></p>
                </div>
            </div>
        </body>
        </html>
        EOF

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        publish_dir: ./docs
