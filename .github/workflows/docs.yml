name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install markdown converter
      run: pip install markdown

    - name: Convert README to HTML
      run: |
        mkdir -p docs
        python3 << 'PYTHON_SCRIPT'
        import markdown
        import sys

        with open('README.md', 'r', encoding='utf-8') as f:
            md_content = f.read()

        html_content = f"""<!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Onigirazu - README</title>
            <style>
                body {{
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                    max-width: 900px;
                    margin: 0 auto;
                    padding: 40px 20px;
                    line-height: 1.6;
                    color: #333;
                }}
                h1, h2, h3, h4, h5, h6 {{
                    margin-top: 24px;
                    margin-bottom: 16px;
                    font-weight: 600;
                    line-height: 1.25;
                }}
                h1 {{ font-size: 2em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }}
                h2 {{ font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }}
                code {{
                    background-color: #f6f8fa;
                    padding: 0.2em 0.4em;
                    border-radius: 3px;
                    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
                    font-size: 85%;
                }}
                pre {{
                    background-color: #f6f8fa;
                    padding: 16px;
                    border-radius: 6px;
                    overflow: auto;
                }}
                pre code {{
                    background-color: transparent;
                    padding: 0;
                }}
                a {{ color: #0366d6; text-decoration: none; }}
                a:hover {{ text-decoration: underline; }}
                blockquote {{
                    padding: 0 1em;
                    color: #6a737d;
                    border-left: 0.25em solid #dfe2e5;
                    margin: 0;
                }}
                table {{
                    border-collapse: collapse;
                    width: 100%;
                    margin: 16px 0;
                }}
                table th, table td {{
                    padding: 6px 13px;
                    border: 1px solid #dfe2e5;
                }}
                table tr:nth-child(2n) {{
                    background-color: #f6f8fa;
                }}
                img {{ max-width: 100%; }}
                .back-link {{
                    margin-bottom: 20px;
                    display: inline-block;
                }}
            </style>
        </head>
        <body>
            <a href="index.html" class="back-link">← Back to Documentation</a>
            {markdown.markdown(md_content, extensions=['fenced_code', 'tables', 'codehilite'])}
        </body>
        </html>
        """

        with open('docs/readme.html', 'w', encoding='utf-8') as f:
            f.write(html_content)

        print("README converted successfully")
        PYTHON_SCRIPT

    - name: Create index page
      run: |
        cat > docs/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Onigirazu Documentation</title>
            <style>
                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                    max-width: 800px;
                    margin: 50px auto;
                    padding: 20px;
                    line-height: 1.6;
                }
                h1 { color: #333; }
                a { color: #0066cc; text-decoration: none; }
                a:hover { text-decoration: underline; }
                .links { margin-top: 30px; }
                .link-item { margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
            </style>
        </head>
        <body>
            <h1>Onigirazu Documentation</h1>
            <p>Welcome to the Onigirazu project documentation.</p>
            <div class="links">
                <div class="link-item">
                    <h3>📖 README</h3>
                    <p><a href="readme.html">View the project README</a></p>
                </div>
                <div class="link-item">
                    <h3>📚 API Documentation</h3>
                    <p><a href="https://pkg.go.dev/github.com/onigirazu-cfg/onigirazu" target="_blank">View on pkg.go.dev</a></p>
                </div>
                <div class="link-item">
                    <h3>💻 Source Code</h3>
                    <p><a href="https://github.com/onigirazu-cfg/onigirazu" target="_blank">View on GitHub</a></p>
                </div>
            </div>
        </body>
        </html>
        EOF

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
