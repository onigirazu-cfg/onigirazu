name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.23'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ github.event.inputs.tag }}"
        else
          TAG="${{ github.ref_name }}"
        fi

        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # Check if it's a prerelease (contains alpha, beta, rc)
        if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

        # Validate tag format
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
          echo "Invalid tag format: $TAG"
          exit 1
        fi

  test:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run full test suite
      run: |
        go test -race -coverprofile=coverage.out -covermode=atomic -timeout=10m ./...
        go test -bench=. -benchmem ./...

    - name: Run security scan
      run: |
        go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
        gosec ./...
      continue-on-error: true

  release:
    runs-on: ubuntu-latest
    needs: [validate, test]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        FURY_TOKEN: ${{ secrets.FURY_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [validate, release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Temporarily disabled DockerHub publishing
    # - name: Login to Docker Hub
    #   if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          # Temporarily disabled DockerHub publishing
          # ${{ secrets.DOCKERHUB_USERNAME && 'onigirazu/onigirazu' || '' }}
          ghcr.io/onigirazu-cfg/onigirazu
        tags: |
          type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }}
          type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }}
          type=semver,pattern={{major}},value=${{ needs.validate.outputs.tag }},enable={{is_default_branch}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ needs.validate.outputs.tag }}
          COMMIT=${{ github.sha }}
          DATE=${{ github.event.head_commit.timestamp }}

  notify:
    runs-on: ubuntu-latest
    needs: [validate, release, docker]
    if: always()

    steps:
    - name: Notify on success
      if: needs.release.result == 'success' && needs.docker.result == 'success'
      run: |
        echo "🎉 Release ${{ needs.validate.outputs.tag }} completed successfully!"
        echo "- Binaries published to GitHub Releases"
        echo "- Docker images pushed to registries"
        echo "- Packages published to package managers"

    - name: Notify on failure
      if: needs.release.result == 'failure' || needs.docker.result == 'failure'
      run: |
        echo "❌ Release ${{ needs.validate.outputs.tag }} failed!"
        echo "Please check the logs and retry."
        exit 1
