name: Release

on:
  workflow_run:
    workflows: ["Release Gate"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      skip_checks:
        description: 'Skip quality checks (not recommended)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.5'

jobs:
  # Check if quality gate passed (only for workflow_run trigger)
  check-quality-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.extract-tag.outputs.tag }}

    steps:
    - name: Check quality gate result
      id: check
      run: |
        if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
          echo "❌ Quality gate failed! Release is blocked."
          echo "should_release=false" >> $GITHUB_OUTPUT
          exit 1
        fi

        echo "✅ Quality gate passed! Proceeding with release..."
        echo "should_release=true" >> $GITHUB_OUTPUT

    - name: Checkout to get tag info
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Extract tag from commit
      id: extract-tag
      env:
        COMMIT_SHA: ${{ github.event.workflow_run.head_commit.id }}
      run: |
        # Find the tag that matches this commit
        TAG=$(git describe --tags --exact-match "$COMMIT_SHA" 2>/dev/null || echo "")

        if [ -z "$TAG" ]; then
          echo "❌ Could not find tag for commit $COMMIT_SHA"
          exit 1
        fi

        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "✅ Found tag: $TAG"

  validate:
    runs-on: ubuntu-latest
    needs: [check-quality-gate]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check-quality-gate.result == 'success')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ github.event.inputs.tag }}"
        elif [ "${{ github.event_name }}" = "workflow_run" ]; then
          TAG="${{ needs.check-quality-gate.outputs.tag }}"
        else
          TAG="${{ github.ref_name }}"
        fi

        echo "tag=$TAG" >> $GITHUB_OUTPUT

        # Check if it's a prerelease (contains alpha, beta, rc)
        if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

        # Validate tag format
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
          echo "Invalid tag format: $TAG"
          exit 1
        fi

  test:
    runs-on: ubuntu-latest
    needs: validate
    # Skip tests if triggered by workflow_run (already tested in quality gate)
    if: github.event_name == 'workflow_dispatch' && !github.event.inputs.skip_checks

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum

    - name: Run full test suite
      run: |
        go test -race -coverprofile=coverage.out -covermode=atomic -timeout=10m ./...

    - name: Run security scan
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec ./...
      continue-on-error: true

  release:
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: always() && needs.validate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Checkout specific tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ github.event.inputs.tag }}"
        else
          TAG="${{ needs.validate.outputs.tag }}"
        fi
        git checkout "refs/tags/$TAG"

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: go.sum

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        FURY_TOKEN: ${{ secrets.FURY_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: always() && needs.validate.result == 'success' && needs.release.result == 'success'

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare version for Docker tags
      id: version
      run: |
        TAG="${{ needs.validate.outputs.tag }}"
        # Remove leading 'v' if present
        VERSION=${TAG#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/onigirazu-cfg/onigirazu
        tags: |
          type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
          type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ needs.validate.outputs.tag }}
          COMMIT=${{ github.sha }}
          DATE=${{ github.event.head_commit.timestamp }}

    - name: Make package public
      run: |
        # Make the GHCR package public
        curl -X PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/orgs/onigirazu-cfg/packages/container/onigirazu \
          -d '{"visibility":"public"}' || echo "Note: Package visibility might already be public or requires manual setup"

  notify:
    runs-on: ubuntu-latest
    needs: [validate, release, docker]
    if: always()

    steps:
    - name: Notify on success
      if: needs.release.result == 'success' && needs.docker.result == 'success'
      run: |
        echo "🎉 Release ${{ needs.validate.outputs.tag }} completed successfully!"
        echo "- Binaries published to GitHub Releases"
        echo "- Docker images pushed to registries"
        echo "- Packages published to package managers"

    - name: Notify on failure
      if: needs.release.result == 'failure' || needs.docker.result == 'failure'
      run: |
        echo "❌ Release ${{ needs.validate.outputs.tag }} failed!"
        echo "Please check the logs and retry."
        exit 1
