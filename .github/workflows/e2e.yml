name: E2E

# Disposable vSphere VMs on a self-hosted runner: for pull requests from this
# repository (only the cases the change needs), by hand, nightly after the
# golden images are rebuilt, and the janitor. Pull requests from forks never
# reach the self-hosted runners.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      cases:
        description: 'Case directories to run, space separated (empty = all)'
        required: false
        type: string
        default: ''
      keep_vms:
        description: 'Keep the VMs for debugging (the janitor removes them after 3h; VMs of other finished runs go at its next run)'
        required: false
        type: boolean
        default: false
      purge_vms:
        description: 'Only remove all e2e VMs now (VMs of runs in progress are kept); no tests'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 5 * * *'   # e2e, after the 01:00 image rebuild
    - cron: '30 * * * *'  # janitor

permissions:
  contents: read
  actions: read   # janitor: keep VMs of runs in progress

jobs:
  # Which cases, on how many shards: a pull request runs the cases its changes
  # need (e2e/select-cases.sh), one shard per ~5 min of cases, at most four
  plan:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' && !inputs.purge_vms) || github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_CASES: ${{ inputs.cases }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cases="$INPUT_CASES"
          if [ "$EVENT" = pull_request ]; then
            cases="$(e2e/select-cases.sh "$BASE" HEAD | paste -sd' ' -)"
            [ -n "$cases" ] || { echo "no e2e case needed"; echo "shards=[]" >> "$GITHUB_OUTPUT"; exit 0; }
            [ "$cases" = all ] && cases=""
          fi
          # seconds of the chosen cases (unknown: 10 s) -> shards of ~150 s:
          # creating a shard's VMs takes ~2 min whatever it runs, so more
          # shards in parallel finish sooner
          list="${cases:-$(ls e2e/cases)}"
          secs="$(for c in $list; do awk -F'\t' -v c="$c" '$1 == c { print $2; f = 1 } END { if (!f) print 10 }' e2e/case-seconds.tsv; done | awk '{ s += $1 } END { print s + 0 }')"
          n=$(( (secs + 149) / 150 )); [ "$n" -ge 1 ] || n=1; [ "$n" -le 4 ] || n=4
          echo "cases: ${cases:-all} (${secs}s) on $n shard(s)"
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq 1 "$n" | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  e2e:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    name: e2e (shard ${{ matrix.shard }})
    runs-on: [self-hosted, vsphere-e2e]
    timeout-minutes: 60
    # Each shard runs on its own pair of VMs
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # A new push to a pull request replaces its running e2e
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GOVC_VERSION: v0.56.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # releases.hashicorp.com drops connections now and then: one retry
      - uses: hashicorp/setup-terraform@v4
        id: terraform
        continue-on-error: true
        with:
          terraform_wrapper: false
      - uses: hashicorp/setup-terraform@v4
        if: steps.terraform.outcome == 'failure'
        with:
          terraform_wrapper: false

      - name: Install govc
        run: |
          dir="$RUNNER_TEMP/govc-$GOVC_VERSION"
          if [ ! -x "$dir/govc" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://github.com/vmware/govmomi/releases/download/$GOVC_VERSION/govc_Linux_x86_64.tar.gz" | tar -xz -C "$dir" govc
          fi
          echo "$dir" >> "$GITHUB_PATH"

      - name: Run e2e
        env:
          TF_VAR_vsphere_server: ${{ secrets.VSPHERE_SERVER }}
          TF_VAR_vsphere_user: ${{ secrets.VSPHERE_USER }}
          TF_VAR_vsphere_password: ${{ secrets.VSPHERE_PASSWORD }}
          TF_VAR_datacenter: ${{ secrets.E2E_DATACENTER }}
          TF_VAR_cluster: ${{ secrets.E2E_CLUSTER }}
          TF_VAR_host: ${{ secrets.E2E_HOST }}
          TF_VAR_datastore: ${{ secrets.E2E_DATASTORE }}
          TF_VAR_network: ${{ secrets.E2E_NETWORK }}
          TF_VAR_folder: ${{ secrets.E2E_FOLDER }}
          TF_VAR_library: ${{ secrets.E2E_LIBRARY }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_CASES: ${{ needs.plan.outputs.cases }}
          KEEP_VMS: ${{ inputs.keep_vms && '1' || '' }}
          # the nightly run tests the golden images themselves
          E2E_BASE: ${{ github.event_name == 'schedule' && '0' || '1' }}
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          E2E_DIAG: ${{ runner.temp }}/e2e-diag
          MIKROTIK_API_URL: ${{ secrets.MIKROTIK_API_URL }}
          MIKROTIK_API_USER: ${{ secrets.MIKROTIK_API_USER }}
          MIKROTIK_API_PASSWORD: ${{ secrets.MIKROTIK_API_PASSWORD }}
          MIKROTIK_API_INSECURE: ${{ secrets.MIKROTIK_API_INSECURE }}
        run: e2e/run.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diag-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-diag
          if-no-files-found: ignore
          retention-days: 7

  janitor:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 * * * *'
    runs-on: [self-hosted, vsphere-e2e]
    timeout-minutes: 15
    env:
      GOVC_VERSION: v0.56.0
    steps:
      - uses: actions/checkout@v7

      - name: Install govc
        run: |
          dir="$RUNNER_TEMP/govc-$GOVC_VERSION"
          if [ ! -x "$dir/govc" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://github.com/vmware/govmomi/releases/download/$GOVC_VERSION/govc_Linux_x86_64.tar.gz" | tar -xz -C "$dir" govc
          fi
          echo "$dir" >> "$GITHUB_PATH"

      - name: Remove expired e2e VMs
        env:
          GOVC_URL: ${{ secrets.VSPHERE_SERVER }}
          GOVC_USERNAME: ${{ secrets.VSPHERE_USER }}
          GOVC_PASSWORD: ${{ secrets.VSPHERE_PASSWORD }}
          GOVC_INSECURE: '1'
          E2E_DATACENTER: ${{ secrets.E2E_DATACENTER }}
          E2E_FOLDER: ${{ secrets.E2E_FOLDER }}
          E2E_CLUSTER: ${{ secrets.E2E_CLUSTER }}
          TTL_HOURS: ${{ inputs.purge_vms && '0' || '3' }}
          MIKROTIK_API_URL: ${{ secrets.MIKROTIK_API_URL }}
          MIKROTIK_API_USER: ${{ secrets.MIKROTIK_API_USER }}
          MIKROTIK_API_PASSWORD: ${{ secrets.MIKROTIK_API_PASSWORD }}
          MIKROTIK_API_INSECURE: ${{ secrets.MIKROTIK_API_INSECURE }}
          GH_TOKEN: ${{ github.token }}
        run: e2e/janitor.sh
