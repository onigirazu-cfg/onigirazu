name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  GO_VERSION: '1.24.9'

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install quality tools
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
        go install github.com/client9/misspell/cmd/misspell@latest
        go install mvdan.cc/gofumpt@latest
        go install github.com/segmentio/golines@latest
        go install golang.org/x/tools/cmd/goimports@latest

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          echo "Please run 'gofmt -s -w .' to format your code."
          exit 1
        fi

    - name: Check imports
      run: |
        if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
          echo "The following files have import issues:"
          goimports -l .
          echo "Please run 'goimports -w .' to fix imports."
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: staticcheck ./...

    - name: Check cyclomatic complexity
      run: |
        gocyclo -over 15 . || echo "Some functions have high cyclomatic complexity"

    - name: Check for misspellings
      run: |
        misspell -error .

    - name: Check line length
      run: |
        golines -l . | head -20 || echo "Some lines are too long"

    - name: Run ineffassign
      run: |
        go install github.com/gordonklaus/ineffassign@latest
        ineffassign ./...

    - name: Run go mod tidy check
      run: |
        go mod tidy
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "go.mod or go.sum is not tidy"
          git diff go.mod go.sum
          exit 1
        fi

    - name: Check for TODO/FIXME comments
      run: |
        echo "Checking for TODO/FIXME comments..."
        TODO_COUNT=$(grep -r "TODO\|FIXME" --include="*.go" . | wc -l)
        echo "Found $TODO_COUNT TODO/FIXME comments"
        if [ $TODO_COUNT -gt 0 ]; then
          echo "TODO/FIXME comments found:"
          grep -r "TODO\|FIXME" --include="*.go" . || true
        fi

  test-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run tests with coverage
      run: |
        go test -race -coverprofile=coverage.out -covermode=atomic ./...
        go tool cover -html=coverage.out -o coverage.html

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"

        # Set minimum coverage threshold (lowered temporarily)
        THRESHOLD=15

        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        else
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
        fi

    - name: Upload coverage reports
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.html
        retention-days: 30

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('coverage.out', 'utf8');
          const lines = coverage.split('\n');
          const totalLine = lines.find(line => line.includes('total:'));

          if (totalLine) {
            const match = totalLine.match(/(\d+\.\d+)%/);
            if (match) {
              const coveragePercent = match[1];

              const comment = `## 📊 Test Coverage Report

              Current coverage: **${coveragePercent}%**

              ${parseFloat(coveragePercent) >= 15 ? '✅' : '❌'} Coverage ${parseFloat(coveragePercent) >= 15 ? 'meets' : 'below'} threshold (15%)
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          }

  documentation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Check documentation coverage
      run: |
        echo "Checking for undocumented exported functions..."

        # Find exported functions without documentation
        UNDOCUMENTED=$(find . -name "*.go" -not -path "./vendor/*" -exec grep -l "^func [A-Z]" {} \; | \
          xargs -I {} sh -c 'echo "=== {} ==="; grep -B1 "^func [A-Z]" {} | grep -v "^//"' | \
          grep -c "^func [A-Z]" || echo "0")

        echo "Found $UNDOCUMENTED potentially undocumented exported functions"

    - name: Generate documentation
      run: |
        mkdir -p docs/api
        # Generate package documentation using go doc
        echo "# API Documentation" > docs/api/README.md
        echo "" >> docs/api/README.md
        echo "Generated on: $(date)" >> docs/api/README.md
        echo "" >> docs/api/README.md

        # List all packages
        for pkg in $(go list ./...); do
          echo "## Package: $pkg" >> docs/api/README.md
          echo "" >> docs/api/README.md
          go doc -all $pkg >> docs/api/README.md 2>/dev/null || echo "No documentation available" >> docs/api/README.md
          echo "" >> docs/api/README.md
          echo "---" >> docs/api/README.md
          echo "" >> docs/api/README.md
        done

        echo "Documentation generated successfully"

    - name: Upload documentation
      uses: actions/upload-artifact@v5
      with:
        name: documentation
        path: docs/api/
        retention-days: 7

  performance:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run benchmarks
      run: |
        echo "Running benchmarks..."
        go test -bench=. -benchmem -run=^$ ./... > benchmark.txt 2>&1 || echo "Some benchmarks failed"

        if [ -s benchmark.txt ]; then
          echo "Benchmark results:"
          cat benchmark.txt
        else
          echo "No benchmarks found or all benchmarks failed"
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v5
      with:
        name: benchmark-results
        path: benchmark.txt
        retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: [code-quality, test-coverage, documentation, performance]
    if: always()

    steps:
    - name: Quality gate summary
      run: |
        echo "## 📋 Code Quality Summary"
        echo ""
        echo "| Check | Status |"
        echo "|-------|--------|"
        echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo "| Test Coverage | ${{ needs.test-coverage.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo "| Documentation | ${{ needs.documentation.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo "| Performance | ${{ needs.performance.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo ""

        if [[ "${{ needs.code-quality.result }}" != "success" ||
              "${{ needs.test-coverage.result }}" != "success" ]]; then
          echo "❌ Quality gate failed!"
          exit 1
        else
          echo "✅ Quality gate passed!"
        fi
