name: License Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  license-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23'

    - name: Install go-licenses
      run: go install github.com/google/go-licenses@latest

    - name: Check licenses
      continue-on-error: true
      run: |
        # Known issue with go-licenses and Go 1.21+ toolchains
        # See: https://github.com/google/go-licenses/issues/244
        go-licenses check ./...

    - name: Generate license report
      continue-on-error: true
      run: |
        go-licenses report ./... > licenses.txt || echo "License report generation completed with warnings"

    - name: Upload license report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: licenses.txt
