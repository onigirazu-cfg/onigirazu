name: Release Gate

# This workflow ensures all quality checks pass before allowing a release
# It runs automatically when a tag is pushed and blocks the release if checks fail

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write
  actions: read

env:
  GO_VERSION: '1.24'

jobs:
  # Run all quality checks first
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run Gosec Security Scanner
      continue-on-error: true
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -fmt sarif -out gosec.sarif -verbose=text ./... || true

    - name: Upload Gosec SARIF file
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: gosec.sarif
        category: gosec

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install quality tools
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        go install golang.org/x/tools/cmd/goimports@latest

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi

    - name: Check imports
      run: |
        if [ "$(goimports -l . | wc -l)" -gt 0 ]; then
          echo "The following files have import issues:"
          goimports -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: staticcheck ./...

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests with race detection
      run: go test -race -coverprofile=coverage.out -covermode=atomic -timeout=10m ./...

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"
        THRESHOLD=15
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        fi

  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: [tests]

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p dist
        BINARY_NAME=onigirazu
        if [ "$GOOS" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi
        go build -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
          -o dist/${BINARY_NAME}-${GOOS}-${GOARCH} ./cmd/onigirazu

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.5.0
        args: --timeout=10m

  # Quality gate - all checks must pass
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, tests, build, lint]
    if: always()

    steps:
    - name: Check all jobs status
      run: |
        echo "## 🚦 Release Quality Gate"
        echo ""
        echo "| Check | Status |"
        echo "|-------|--------|"
        echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo "| Tests | ${{ needs.tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        echo ""

        if [[ "${{ needs.security-scan.result }}" != "success" ||
              "${{ needs.code-quality.result }}" != "success" ||
              "${{ needs.tests.result }}" != "success" ||
              "${{ needs.build.result }}" != "success" ||
              "${{ needs.lint.result }}" != "success" ]]; then
          echo "❌ Quality gate FAILED! Release is blocked."
          echo ""
          echo "Please fix the failing checks before releasing."
          exit 1
        fi

        echo "✅ Quality gate PASSED! Proceeding with release..."

  # Only run release if quality gate passes
  trigger-release:
    name: Trigger Release
    runs-on: ubuntu-latest
    needs: [quality-gate]
    outputs:
      tag: ${{ steps.tag-info.outputs.tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Extract and output tag info
      id: tag-info
      run: |
        TAG="${{ github.ref_name }}"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Tag: $TAG"

    - name: Trigger release workflow
      run: |
        echo "✅ All quality checks passed!"
        echo "🚀 Release workflow will be triggered automatically by the tag push."
        echo ""
        echo "Tag: ${{ steps.tag-info.outputs.tag }}"
        echo "Commit: ${{ github.sha }}"
        echo ""
        echo "Monitor the release at:"
        echo "https://github.com/${{ github.repository }}/actions/workflows/release.yml"
