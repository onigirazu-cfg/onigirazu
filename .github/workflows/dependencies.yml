name: Update Dependencies

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch: # Allow manual trigger
    inputs:
      update_type:
        description: 'Type of update'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: '1.24'

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Get current dependencies
      run: |
        echo "Current dependencies:" > dependency-changes.txt
        go list -m -u all >> dependency-changes.txt

    - name: Update Go dependencies
      run: |
        echo "Updating dependencies..."

        # Update based on type
        case "${{ github.event.inputs.update_type || 'minor' }}" in
          "patch")
            # Only patch updates
            go get -u=patch ./...
            ;;
          "minor")
            # Minor and patch updates (default)
            go get -u ./...
            ;;
          "major")
            # All updates including major
            go get -u ./...
            # Additional major version updates if needed
            ;;
        esac

        go mod tidy

    - name: Check for vulnerabilities
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./... || echo "Vulnerabilities found, but continuing..."

    - name: Run tests
      run: |
        go test -race -timeout=10m ./...

    - name: Run security scan
      continue-on-error: true
      run: |
        go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest || true
        gosec ./... || echo "Security issues found, but continuing..."

    - name: Generate dependency report
      run: |
        echo "" >> dependency-changes.txt
        echo "Updated dependencies:" >> dependency-changes.txt
        go list -m -u all >> dependency-changes.txt

        echo "" >> dependency-changes.txt
        echo "Dependency changes:" >> dependency-changes.txt
        git diff go.mod go.sum >> dependency-changes.txt || echo "No changes in go.mod/go.sum"

    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet go.mod go.sum; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No dependency updates available"
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Dependencies updated"
        fi

    - name: Create Pull Request
      if: steps.changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GH_TOKEN }}
        commit-message: "chore: update Go dependencies (${{ github.event.inputs.update_type || 'minor' }})"
        title: "🔄 Update Go dependencies (${{ github.event.inputs.update_type || 'minor' }})"
        body: |
          ## 📦 Dependency Updates

          This PR updates Go dependencies to their latest versions.

          **Update type**: ${{ github.event.inputs.update_type || 'minor' }}

          ### Changes:
          - Updated Go modules to latest compatible versions
          - Ran `go mod tidy` to clean up dependencies
          - All tests are passing ✅
          - Security scan completed 🔒
          - Vulnerability check completed 🛡️

          ### Testing:
          - [x] Unit tests pass
          - [x] Race condition tests pass
          - [x] Security scan completed
          - [x] Vulnerability check completed

          ---

          🤖 Auto-generated by GitHub Actions
        branch: update-dependencies-${{ github.run_number }}
        delete-branch: true
        labels: |
          dependencies
          automated
          ${{ github.event.inputs.update_type || 'minor' }}

    - name: Comment if no changes
      if: steps.changes.outputs.has_changes == 'false'
      run: |
        echo "✅ All dependencies are up to date!"
        echo "No pull request created as there are no updates available."

  security-audit:
    runs-on: ubuntu-latest
    needs: update-dependencies

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run comprehensive security audit
      run: |
        echo "Running security audit..."

        # Install security tools
        go install golang.org/x/vuln/cmd/govulncheck@latest

        # Check for vulnerabilities
        echo "Checking for vulnerabilities..."
        govulncheck ./...

        # Check for outdated dependencies with known issues
        echo "Checking dependency security..."
        go list -json -deps ./... | jq -r '.Module.Path' | sort -u > deps.txt
        echo "Dependencies checked: $(wc -l < deps.txt)"

    - name: Create security report
      run: |
        echo "# Security Audit Report" > security-report.md
        echo "" >> security-report.md
        echo "Generated on: $(date)" >> security-report.md
        echo "" >> security-report.md
        echo "## Vulnerability Scan Results" >> security-report.md
        govulncheck ./... >> security-report.md 2>&1 || echo "Scan completed with findings" >> security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-audit-report
        path: security-report.md
        retention-days: 30
