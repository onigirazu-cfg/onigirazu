run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - staticcheck
    - unused
    - errcheck
    - gosimple
    - ineffassign

issues:
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_generated\\.go$"
  exclude-dirs:
    - vendor
