---
# Advanced Remote Testing
# Tests various modules and variable substitution

plays:
  - name: "Advanced Remote Testing"
    hosts: all
    gather_facts: true
    vars:
      test_dir: "{{ onigirazu_env.HOME }}/onigirazu_test"
      test_file: "system_info.txt"

    tasks:
      - name: "Display system information"
        debug:
          msg: |
            === System Information ===
            Hostname: {{ onigirazu_hostname }}
            OS Family: {{ onigirazu_os_family }}
            Distribution: {{ onigirazu_distribution }} {{ onigirazu_distribution_version }}
            Architecture: {{ onigirazu_architecture }}
            Kernel: {{ onigirazu_kernel }} {{ onigirazu_kernel_version }}
            CPU Cores: {{ onigirazu_processor_cores }}
            Memory: {{ onigirazu_memtotal_mb }}
            User: {{ onigirazu_user_id }}
            Home: {{ onigirazu_env.HOME }}
            Current Time: {{ onigirazu_date_time.iso8601 }}

      - name: "Create test directory"
        file:
          path: "{{ test_dir }}"
          state: "directory"
          mode: "0755"

      - name: "Create system info file"
        command:
          cmd: "bash"
          args: ["-c", "cat > {{ test_dir }}/{{ test_file }} << 'EOF'
System Information Report
Generated by Onigirazu on {{ onigirazu_date_time.iso8601 }}

Hostname: {{ onigirazu_hostname }}
FQDN: {{ onigirazu_fqdn }}
OS Family: {{ onigirazu_os_family }}
Distribution: {{ onigirazu_distribution }} {{ onigirazu_distribution_version }}
Architecture: {{ onigirazu_architecture }}
Kernel: {{ onigirazu_kernel }} {{ onigirazu_kernel_version }}

Hardware:
- CPU Cores: {{ onigirazu_processor_cores }}
- Memory: {{ onigirazu_memtotal_mb }}

Network:
- Default IPv4: {{ onigirazu_default_ipv4.address }}

User Context:
- User: {{ onigirazu_user_id }}
- Home: {{ onigirazu_env.HOME }}

Date/Time:
- ISO8601: {{ onigirazu_date_time.iso8601 }}
- Date: {{ onigirazu_date_time.date }}
- Time: {{ onigirazu_date_time.time }}
- Weekday: {{ onigirazu_date_time.weekday }}
EOF
"]

      - name: "Verify file was created"
        command:
          cmd: "cat"
          args: ["{{ test_dir }}/{{ test_file }}"]
        register: file_content

      - name: "Display file content"
        debug:
          msg: "{{ file_content.stdout }}"

      - name: "Test conditional execution (Debian-based)"
        debug:
          msg: "This is a Debian-based system"
        when: "onigirazu_os_family == 'Debian'"

      - name: "Test conditional execution (RedHat-based)"
        debug:
          msg: "This is a RedHat-based system"
        when: "onigirazu_os_family == 'RedHat'"

      - name: "Check disk usage"
        command:
          cmd: "df"
          args: ["-h", "{{ onigirazu_env.HOME }}"]
        register: disk_usage

      - name: "Display disk usage"
        debug:
          msg: "{{ disk_usage.stdout }}"

      - name: "Cleanup test directory"
        file:
          path: "{{ test_dir }}"
          state: "absent"

      - name: "Final summary"
        debug:
          msg: |
            === Test Completed Successfully ===
            All onigirazu_* variables are working correctly!
            Tested on: {{ onigirazu_hostname }} ({{ onigirazu_os_family }})
            Completed at: {{ onigirazu_date_time.iso8601 }}
