---
plays:
  - name: Test Config Module Remote Execution (Simple)
    hosts: cs_server
    gather_facts: false
    tasks:
      - name: Create test directory
        file:
          path: /tmp/config_test
          state: directory
          mode: "0755"

      - name: Create initial JSON config file
        copy:
          content: |
            {
              "database": {
                "host": "localhost",
                "port": 5432
              },
              "app": {
                "name": "test-app"
              }
            }
          dest: /tmp/config_test/app.json

      - name: Set a value in JSON config with backup
        config:
          path: /tmp/config_test/app.json
          format: json
          action: set
          key: database.host
          value: "db.example.com"
          backup: true

      - name: Verify the change was made on remote host
        command:
          cmd: cat
          args: ["/tmp/config_test/app.json"]
        register: config_content

      - name: Display config content
        debug:
          msg: "Config content: {{ config_content.stdout }}"

      - name: Check if backup exists using command
        command:
          cmd: ls
          args: ["-la", "/tmp/config_test/"]
        register: backup_check

      - name: Display directory listing
        debug:
          msg: "Directory listing: {{ backup_check.stdout }}"

      - name: Get value from config
        config:
          path: /tmp/config_test/app.json
          format: json
          action: get
          key: database.host
        register: get_result

      - name: Display retrieved value
        debug:
          msg: "Retrieved value: {{ get_result.value }}"

      - name: Delete a key from JSON config
        config:
          path: /tmp/config_test/app.json
          format: json
          action: delete
          key: app.name

      - name: Verify deletion on remote host
        command:
          cmd: cat
          args: ["/tmp/config_test/app.json"]
        register: after_delete

      - name: Display content after deletion
        debug:
          msg: "After deletion: {{ after_delete.stdout }}"

      - name: Restore from backup
        config:
          path: /tmp/config_test/app.json
          format: json
          action: restore

      - name: Verify restore on remote host
        command:
          cmd: cat
          args: ["/tmp/config_test/app.json"]
        register: after_restore

      - name: Display content after restore
        debug:
          msg: "After restore: {{ after_restore.stdout }}"

      - name: Cleanup test files
        file:
          path: /tmp/config_test
          state: absent
