---
plays:
  - name: Test Config Module Remote Execution
    hosts: cs_server
    gather_facts: false
    tasks:
      - name: Create test directory
        file:
          path: /tmp/config_test
          state: directory
          mode: "0755"

      - name: Create initial JSON config file
        copy:
          content: |
            {
              "database": {
                "host": "localhost",
                "port": 5432
              },
              "app": {
                "name": "test-app"
              }
            }
          dest: /tmp/config_test/app.json

      - name: Set a value in JSON config
        config:
          path: /tmp/config_test/app.json
          format: json
          action: set
          key: database.host
          value: "db.example.com"
          backup: true

      - name: Verify the change was made on remote host
        command:
          cmd: "cat /tmp/config_test/app.json"
        register: config_content

      - name: Display config content
        debug:
          var: config_content.stdout

      - name: Check if backup was created on remote host
        stat:
          path: /tmp/config_test/app.json.backup
        register: backup_stat

      - name: Display backup status
        debug:
          msg: "Backup exists on remote: {{ backup_stat.stat.exists }}"

      - name: Get value from config
        config:
          path: /tmp/config_test/app.json
          format: json
          action: get
          key: database.host
        register: get_result

      - name: Display retrieved value
        debug:
          msg: "Retrieved value: {{ get_result.value }}"

      - name: Create YAML config file
        copy:
          content: |
            server:
              host: localhost
              port: 8080
            features:
              - auth
              - logging
          dest: /tmp/config_test/config.yaml

      - name: Set value in YAML config
        config:
          path: /tmp/config_test/config.yaml
          format: yaml
          action: set
          key: server.port
          value: "9090"

      - name: Verify YAML change on remote host
        command:
          cmd: "cat /tmp/config_test/config.yaml"
        register: yaml_content

      - name: Display YAML content
        debug:
          var: yaml_content.stdout

      - name: Delete a key from JSON config
        config:
          path: /tmp/config_test/app.json
          format: json
          action: delete
          key: app.name

      - name: Verify deletion on remote host
        command:
          cmd: "cat /tmp/config_test/app.json"
        register: after_delete

      - name: Display content after deletion
        debug:
          var: after_delete.stdout

      - name: Restore from backup
        config:
          path: /tmp/config_test/app.json
          format: json
          action: restore

      - name: Verify restore on remote host
        command:
          cmd: "cat /tmp/config_test/app.json"
        register: after_restore

      - name: Display content after restore
        debug:
          var: after_restore.stdout

      - name: Cleanup test files
        file:
          path: /tmp/config_test
          state: absent
