# Onigirazu Playbook Example
# This is a simple example playbook that demonstrates basic functionality

name: Example Playbook - Basic Server Setup
description: Install and configure basic server components

# Global variables for all plays
vars:
  app_name: myapp
  app_version: "1.0.0"
  app_user: appuser

plays:
  # Play 1: System preparation
  - name: Prepare system
    hosts: all
    vars:
      packages_to_install:
        - curl
        - wget
        - git
        - vim

    tasks:
      - name: Update package cache
        package:
          update_cache: yes
        when: onigirazu_os_family == "Debian"

      - name: Install essential packages
        package:
          name: "{{ item }}"
          state: present
        loop: "{{ packages_to_install }}"

      - name: Set timezone
        command:
          cmd: timedatectl set-timezone {{ timezone | default('UTC') }}
        when: onigirazu_service_mgr == "systemd"

  # Play 2: User management
  - name: Setup application user
    hosts: all

    tasks:
      - name: Create application user
        user:
          name: "{{ app_user }}"
          state: present
          shell: /bin/bash
          create_home: yes

      - name: Create application directory
        file:
          path: "/opt/{{ app_name }}"
          state: directory
          owner: "{{ app_user }}"
          group: "{{ app_user }}"
          mode: "0755"

  # Play 3: Web server setup (only on webservers)
  - name: Setup web server
    hosts: webservers
    vars:
      nginx_config_path: /etc/nginx/sites-available

    tasks:
      - name: Install Nginx
        package:
          name: nginx
          state: present

      - name: Start and enable Nginx
        service:
          name: nginx
          state: started
          enabled: yes

      - name: Deploy Nginx configuration
        template:
          src: nginx.conf.j2
          dest: "{{ nginx_config_path }}/{{ app_name }}"
          owner: root
          group: root
          mode: "0644"
        notify: reload nginx

      - name: Enable site
        file:
          src: "{{ nginx_config_path }}/{{ app_name }}"
          dest: "/etc/nginx/sites-enabled/{{ app_name }}"
          state: link
        notify: reload nginx

  # Play 4: Database setup (only on databases)
  - name: Setup database
    hosts: databases

    tasks:
      - name: Install PostgreSQL
        package:
          name: postgresql
          state: present

      - name: Start and enable PostgreSQL
        service:
          name: postgresql
          state: started
          enabled: yes

      - name: Create database
        command:
          cmd: sudo -u postgres createdb {{ db_name }}
        ignore_errors: yes

  # Play 5: Security hardening
  - name: Security hardening
    hosts: production

    tasks:
      - name: Install fail2ban
        package:
          name: fail2ban
          state: present

      - name: Start and enable fail2ban
        service:
          name: fail2ban
          state: started
          enabled: yes

      - name: Configure firewall - allow SSH
        command:
          cmd: ufw allow 22/tcp
        when: onigirazu_os_family == "Debian"

      - name: Configure firewall - allow HTTP
        command:
          cmd: ufw allow 80/tcp
        when: onigirazu_os_family == "Debian" and inventory_hostname in groups['webservers']

      - name: Configure firewall - allow HTTPS
        command:
          cmd: ufw allow 443/tcp
        when: onigirazu_os_family == "Debian" and inventory_hostname in groups['webservers']

      - name: Enable firewall
        command:
          cmd: ufw --force enable
        when: onigirazu_os_family == "Debian"

  # Play 6: Gather and display system information
  - name: Display system information
    hosts: all

    tasks:
      - name: Gather system facts
        setup:

      - name: Display OS information
        debug:
          msg: |
            Hostname: {{ onigirazu_hostname }}
            OS: {{ onigirazu_distribution }} {{ onigirazu_distribution_version }}
            Kernel: {{ onigirazu_kernel }}
            Architecture: {{ onigirazu_architecture }}
            CPU Cores: {{ onigirazu_processor_cores }}
            Memory: {{ onigirazu_memtotal_mb }} MB

      - name: Check disk space
        command:
          cmd: df -h /
        register: disk_space

      - name: Display disk space
        debug:
          var: disk_space.stdout_lines

# Handlers (triggered by notify)
handlers:
  - name: reload nginx
    service:
      name: nginx
      state: reloaded
