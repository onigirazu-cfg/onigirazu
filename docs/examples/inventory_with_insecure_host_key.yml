# insecure_ignore_host_key: true turns the SSH host key check off.
# Use it only for disposable test machines.
groups:
  dev:
    hosts:
      dev-server-01:
        address: 192.168.1.100
        user: deploy
        insecure_ignore_host_key: true   # this host only
      dev-server-02:
        address: 192.168.1.101
        user: deploy
    vars:
      insecure_ignore_host_key: true     # every host of the group
      environment: dev

  prod:
    hosts:
      prod-server-01:
        address: 10.0.1.100
        user: deploy
        key_file: ~/.ssh/prod_key        # host keys are checked
    vars:
      environment: prod
