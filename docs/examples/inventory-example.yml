                        gitpush2-dev:
                        gitpush3-dev:
                cron_servers:
                  children:
                    dev_cron_servers:
                      hosts:
                        cron3-dev:
                infrastructure:
                  children:
                    bastion:
                      hosts:
                        bastion1-dev:
                        bastion2-dev:
                    cm_servers:
                    dba_servers:
                      children:
                        dev_dba_servers:
                          hosts:
                            dba3-dev:
                    deployment_servers:
                    jenkins_servers:
                      children:
                        jenkins_masters:
                          hosts:
                            jenkins-development:

                        jenkins_nodes:
                          hosts:
                            jenkins-development-node-0:

                    jenkins_development:
                      hosts:
                        jenkins-development:
                        jenkins-development-node-0:
                    ldap_servers:
                      children:
                        dev_ldap_servers:
                          children:
                            ldap_masters:
                              hosts:
                                ldap-master-dev:
                            ldap_webs:
                              children:
                                ldap_web_containerized_pwm:
                                  hosts:
                                    ldap-web-dev:
                        dev_servers_prod_ldap:
                          children:
                            ldap_relays:
                              hosts:
                                ldap-aws-us-east-1c-1:
                                ldap-aws-us-east-1a-1:
                                ldap-gcp-us-central1-c-1:
                    metrics_servers:
                      children:
                        dev_metrics_servers:
