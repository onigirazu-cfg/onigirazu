    # dev_nasbox_smokes is comingled with server_meta.py in the "development" merged inventory directory
    # make it a root group so it does not cause farm hosts to inherit corporate variables
    dev-nasbox-smokes:
      children:
        dev_nasbox_smokes:
          hosts:
            smoke-api:

    # Mirror production hierarchy, but delegate all group membership to dev_ prefixes:
    # This is required in order to override production group_vars:
    development:
      children:
        corporate:
          children:
            dev_corporate:
              children:
                aws_corporate:
                  children:
                    dev_aws_corporate:
                      hosts:
                        dba3-dev:
                      children:
                        dev_aws_api_servers:
                        dev_cron_servers:
                        dev_overdrive_servers:
                corporate_nasbox:
                  children:
                    dev_corporate_nasbox:
                      hosts:
                        gitpush2-dev:
                        gitpush3-dev:
                        cron3-dev:
                      children:
                        api_servers:
                          children:
                            aws_api_servers:
                              children:
                                dev_aws_api_servers:
                                  hosts:
                                    api4-dev:
                                    api5-dev:
                                    api6-dev:
                                    api7-dev:
                                    api8-dev:
                                    smoke-api:
                        corp_nfs_servers:
                          children:
                            dev_corp_nfs_servers:
                              hosts:
                                corp-nfs2-dev:
                        overdrive_servers:
                          children:
                            dev_overdrive_servers:
                              hosts:
                                overdrive2-dev:
                                overdrive3-dev:
                                overdrive-dev-pe:
                customer_db_clients:
                  children:
                    api_servers:
                    cron_servers:
                    dba_servers:
                    overdrive_servers:
                git_push_servers:
                  children:
                    dev_git_push_servers:
